        } else {
          ks = fnv(2166136261, k[0] + '|' + k[1]);
          const e = extOf(k[0]);
          if (!inRegen){
            const rg = REGEN.find(r => r.file && r.re.test(k[0]));
            if (rg) A.regen.push({v:v.id, p:path, n:k, rule:rg});
            if (k[1] >= 1e9 && k[2] && k[2] < now - 365*86400) A.old.push({v:v.id, p:path, n:k});
            if (/^(zip|rar|7z)$/.test(e)){ const base = k[0].slice(0, -(e.length+1)); const twin = names.get(base); if (twin && isDir(twin)) A.zips.push({v:v.id, p:path, n:k, twin}); }
            if (k[1] >= 10e6){ const fk = k[0] + '|' + k[1]; if (!fileSigs.has(fk)) fileSigs.set(fk, []); fileSigs.get(fk).push({v:v.id, p:path, n:k}); }
          }
          // progetti
          const t = PROJ_EXT[e] || (k[0] === 'package.json' ? 'code' : null);
          if (t && path.length){
            let pp = path.slice();
            if (t !== 'code') while (pp.length > 1 && GENERIC.test(pp[pp.length-1])) pp.pop();
            const pk = pathKey(v.id, pp);
            if (!projMap.has(pk)) projMap.set(pk, {v:v.id, path:pp, type:t, file:k[0]});
          }
        }
        h = fnv(h, k[0] + '>' + ks + ';');
      }
      return h;
    })(c.root, [], false);
  }

  // gruppi di duplicati: prima le cartelle intere, poi i file fuori da quelle cartelle
  const covered = new WeakSet();
  const cover = n => { covered.add(n); if (isDir(n)) for (const k of n[3]) cover(k); };
  const dirGroups = [...dirSigs.values()].filter(g => g.length > 1).sort((a,b) => b[0].n[1] - a[0].n[1]);
  for (const g of dirGroups){
    const m = g.filter(x => !covered.has(x.n)); if (m.length < 2) continue;
    A.dupGroups.push({dir:true, members:m, size:m[0].n[1]}); m.forEach(x => cover(x.n));
  }
  for (const g of fileSigs.values()){
    if (g.length < 2) continue;
    const m = g.filter(x => !covered.has(x.n)); if (m.length < 2) continue;
    A.dupGroups.push({dir:false, members:m, size:m[0].n[1]});
  }
  for (const g of A.dupGroups){
    g.reclaim = g.size * (g.members.length - 1);
    const score = x => (/backup|copia|copy|^da |duplicat|vecchio|old/i.test(x.p.join('/')) ? 1 : 0) * 10 + (isOnline(volById(x.v)) ? 0 : 1);
    g.keep = g.members.slice().sort((a,b) => score(a) - score(b))[0];
  }
  A.dupGroups.sort((a,b) => b.reclaim - a.reclaim);
  A.dirSigIndex = new Map(); for (const g of dirSigs.values()) if (g.length > 1) for (const x of g) A.dirSigIndex.set(x.n, g);
  A.regen.sort((a,b) => b.n[1] - a.n[1]);
  A.old.sort((a,b) => b.n[1] - a.n[1]);
  A.zips.sort((a,b) => b.n[1] - a.n[1]);

  // progetti: rimuovi annidati e applica le scelte manuali
  for (const [k, m] of Object.entries(S.projMarks)){
    const [v, ...rest] = k.split(':'); const p = rest.join(':').split('/').filter(Boolean);
    if (m === 'no') projMap.delete(k);
    else if (!projMap.has(k) && nodeAt(v, p)) projMap.set(k, {v, path:p, type:'altro', manual:true});
  }
  const all = [...projMap.values()];
  const inside = (a, o) => a.v === o.v && a.path.length > o.path.length && a.path.slice(0, o.path.length).join('/') === o.path.join('/');
  // una cartella che contiene 2+ progetti è un contenitore (es. "Progetti 2025"), non un progetto
  const containers = new Set(all.filter(o => !o.manual && all.filter(a => inside(a, o)).length >= 2));
  const list = all.filter(o => !containers.has(o)).sort((a,b) => a.path.length - b.path.length);
  const kept = [];
  for (const pr of list){
    if (!pr.manual && kept.some(o => inside(pr, o))) continue;
    const node = nodeAt(pr.v, pr.path); if (!node) continue;
    pr.node = node; pr.name = pr.path[pr.path.length-1]; pr.key = pathKey(pr.v, pr.path);
    const prefix = pr.path.join('/') + '/';
    pr.regen = A.regen.filter(r => r.v === pr.v && (r.p.join('/') + '/').startsWith(prefix) || (r.v === pr.v && r.p.join('/') === pr.path.join('/')));
    pr.regenSize = pr.regen.reduce((a,r) => a + r.n[1], 0);
    pr.copies = (A.dirSigIndex.get(node) || []).filter(x => x.n !== node);
    kept.push(pr);
  }
  A.projects = kept;
  A.totals = {
    dups: A.dupGroups.reduce((a,g) => a + g.reclaim, 0),
    regen: A.regen.reduce((a,r) => a + r.n[1], 0),
    old: A.old.reduce((a,r) => a + r.n[1], 0),
    zips: A.zips.reduce((a,r) => a + r.n[1], 0)
  };
  // evita di contare due volte proxy e render che stanno dentro una copia duplicata già conteggiata
  const extra = new WeakSet(); const mark = n => { extra.add(n); if (isDir(n)) n[3].forEach(mark); };
  A.dupGroups.forEach(g => g.members.filter(m => m !== g.keep).forEach(m => mark(m.n)));
  A.totals.all = A.totals.dups + A.regen.filter(r => !extra.has(r.n)).reduce((a,r) => a + r.n[1], 0) + A.zips.filter(z => !extra.has(z.n)).reduce((a,r) => a + r.n[1], 0);   // "grandi e vecchi" non si somma: va valutato a mano
  ANALYSIS = A;
  return A;
}
function projStatus(pr){
  const s = S.projStatus[pr.key]; if (s) return s;
  return pr.node[2] && pr.node[2] > Date.now()/1000 - 90*86400 ? 'attivo' : 'consegnato';
}

/* ---------- Raccoglitore ---------- */
const binKey = it => pathKey(it.v, it.p, it.name);
function inBin(v, p, name){ return S.bin.some(b => b.v === v && b.name === name && b.p.join('/') === p.join('/')); }
function binAdd(items){
  let added = 0;
  for (const it of items){
    if (inBin(it.v, it.p, it.n[0])) continue;
    S.bin.push({v:it.v, p:it.p.slice(), name:it.n[0], size:it.n[1], d:isDir(it.n)}); added++;
  }
  store.set('hangar-bin', S.bin);
  if (added) toast(added === 1 ? 'Aggiunto al Raccoglitore' : `${added} elementi aggiunti al Raccoglitore`);
}
function binRemove(v, p, name){ S.bin = S.bin.filter(b => !(b.v === v && b.name === name && b.p.join('/') === p.join('/'))); store.set('hangar-bin', S.bin); }
function binTotal(){
  // non conta due volte un elemento già compreso in una cartella raccolta
  const dirs = S.bin.filter(b => b.d).map(b => b.v + ':' + b.p.concat(b.name).join('/') + '/');
  return S.bin.reduce((a,b) => { const k = b.v + ':' + b.p.join('/') + '/'; return dirs.some(d => k.startsWith(d) && d !== b.v + ':' + b.p.concat(b.name).join('/') + '/') ? a : a + b.size; }, 0);
}
function toggleBinItem(it){
  if (inBin(it.v, it.p, it.n[0])){ binRemove(it.v, it.p, it.n[0]); toast('Tolto dal Raccoglitore'); }
  else binAdd([it]);
}
async function emptyBin(){
  if (!S.bin.length) return;
  const onlineItems = S.bin.filter(b => isOnline(volById(b.v))), offline = S.bin.length - onlineItems.length;
  if (!onlineItems.length) return toast('Collega i dischi al Mac per eliminare questi elementi');
  const freed = onlineItems.reduce((a,b)=>a+b.size,0);
  if (S.mode === 'demo'){
    for (const b of onlineItems){
      const parent = nodeAt(b.v, b.p); if (!parent) continue;
      const i = parent[3].findIndex(k => k[0] === b.name); if (i < 0) continue;
      const [gone] = parent[3].splice(i, 1);
      const vol = volById(b.v); vol.freeBytes += gone[1];
      const cnt = isDir(gone) ? countTree(gone) : {files:1, folders:0}; vol.fileCount -= cnt.files; vol.folderCount -= cnt.folders + (isDir(gone)?1:0);
      let n = S.catalogs.get(b.v).root; n[1] -= gone[1]; for (const name of b.p){ n = n[3].find(x => x[0] === name && isDir(x)); n[1] -= gone[1]; }
      const c = S.catalogs.get(b.v); c.flat = null; c.rev = (c.rev || 0) + 1;
    }
    statCache = new WeakMap();
    S.bin = S.bin.filter(b => !isOnline(volById(b.v))); store.set('hangar-bin', S.bin);
    toast(`Spostati nel Cestino: ${fmtBytes(freed)} liberati${offline ? `. ${offline} restano in attesa del disco` : ''}`);
    S.anim = false; return render();
  }
  if (S.mode === 'native'){
    const byVol = {};
    for (const b of onlineItems) (byVol[b.v] ||= []).push(b.p.concat(b.name).join('/'));
    const ok = new Set(); let msg = '';
    for (const [v, paths] of Object.entries(byVol)){
      const r = await N.call('trash', {id: v, paths});
      if (r.ok) ok.add(v); else if (r.cancelled) return toast('Nessun file spostato'); else msg = r.error;
    }
    const freedOk = onlineItems.filter(b => ok.has(b.v)).reduce((a,b)=>a+b.size,0);
    S.bin = S.bin.filter(b => !ok.has(b.v)); store.set('hangar-bin', S.bin);
    toast(ok.size ? `Spostati nel Cestino: ${fmtBytes(freedOk)} liberati. Aggiorno l'indice…` : msg || 'Nessun file spostato');
    S.anim = false; return render();
  }
  try {
    const byVol = {};
    for (const b of onlineItems) (byVol[b.v] ||= []).push(b.p.concat(b.name).join('/'));
    for (const [v, paths] of Object.entries(byVol)) await S.fb.sendTrash(v, paths);
    S.bin = S.bin.filter(b => !isOnline(volById(b.v))); store.set('hangar-bin', S.bin);
    toast(`Richiesta inviata al Mac: conferma lì per spostare ${fmtBytes(freed)} nel Cestino`);
    render();
  } catch(err){ console.error(err); toast('Il Mac non risponde: controlla che Hangar sia aperto'); }
}
function countTree(n, acc = {files:0, folders:0}){ for (const k of n[3]){ if (isDir(k)){ acc.folders++; countTree(k, acc); } else acc.files++; } return acc; }

const FOLDER_GLYPH = `<svg viewBox="0 0 64 52" class="glyph"><defs><linearGradient id="fgB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".25"/></linearGradient><linearGradient id="fgF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".62"/></linearGradient></defs><path d="M4 8a4 4 0 0 1 4-4h14l5 5h29a4 4 0 0 1 4 4v31a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="url(#fgB)"/><rect x="4" y="15" width="56" height="33" rx="4" fill="url(#fgF)"/></svg>`;
function lensItems(node){
  const kids = node[3].slice().sort((a,b) => b[1]-a[1]);
  const total = node[1] || 1;
  const big = kids.filter((k, i) => i < 14 && k[1] / total > 0.004);
  const rest = kids.slice(big.length);
  return {kids, big, rest, restSize: rest.reduce((a,k)=>a+k[1],0)};
}
function packCircles(rs, gap){
  const placed = [];
  for (const r of rs){
    if (!placed.length){ placed.push({x:0, y:0, r}); continue; }
    let best = null;
    for (const p of placed){
      for (let a = 0; a < TAU; a += TAU/48){
        const x = p.x + (p.r + r + gap) * Math.cos(a), y = p.y + (p.r + r + gap) * Math.sin(a);
        let ok = true; for (const q of placed){ if (Math.hypot(q.x-x, q.y-y) < q.r + r + gap - .5){ ok = false; break; } }
        if (!ok) continue;
        const d = Math.hypot(x * .72, y);       // preferisce disporsi in orizzontale
        if (!best || d < best.d) best = {x, y, d};
      }
    }
    placed.push({x:best.x, y:best.y, r});
  }
  return placed;
}
function renderLens(v){

function layoutBubbles(){
  const stage = $('#lensStage'); if (!stage || !S._lens) return;
  const {big, node, rest, restSize} = S._lens;
  const W = stage.clientWidth, H = stage.clientHeight;
  const items = big.map((k, i) => ({k, i}));
  if (rest.length) items.push({rest:true, size:restSize, n:rest.length});
  const sizes = items.map(it => it.rest ? Math.max(it.size, node[1]*0.004) : it.k[1]);
  const maxS = Math.max(...sizes, 1);
  const rs = sizes.map(sz => Math.max(.16, Math.sqrt(sz / maxS)) * 100);
  const order = rs.map((r, i) => i).sort((a,b) => rs[b] - rs[a]);
  const packed = packCircles(order.map(i => rs[i]), 9);
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  packed.forEach(p => { minX = Math.min(minX, p.x - p.r); maxX = Math.max(maxX, p.x + p.r); minY = Math.min(minY, p.y - p.r); maxY = Math.max(maxY, p.y + p.r); });
  const sc = Math.min((W - 60) / (maxX - minX), (H - 60) / (maxY - minY));
  const cx = W/2 - (minX + maxX)/2 * sc, cy = H/2 - (minY + maxY)/2 * sc;
  const v = volById(S.view.id);
  let html = '<div class="lens-glow"></div>';
  order.forEach((idx, j) => {
    const it = items[idx], p = packed[j], R = p.r * sc;
    const x = cx + p.x * sc - R, y = cy + p.y * sc - R;
    const style = `left:${x}px;top:${y}px;width:${2*R}px;height:${2*R}px;--d:${j}`;
    if (it.rest){
      html += `<div class="bub rest" style="${style}" data-lk="rest"><div class="bub-in"><span class="bub-dots"><i></i><i></i><i></i></span>${R > 44 ? `<b>Altri ${fmtInt(it.n)}</b><span>${fmtBytes(it.size)}</span>` : ''}</div></div>`;
      return;
    }
    const k = it.k, d = isDir(k), on = inBin(v.id, S.view.path, k[0]);
    const kind = d ? null : KINDS[kindOf(k[0])];
    const showText = R > 46, showSize = R > 58;
    html += `<button class="bub ${d?'dir':'file'} ${on?'on':''}" style="${style}${kind ? `;--k:${colorOf(kind.color)}` : ''}" data-act="bub" data-i="${it.i}" data-lk="${it.i}" title="${esc(k[0])} · ${fmtBytes(k[1])}">
      <div class="bub-in" style="--s:${Math.min(1.25, Math.max(.5, R / 110))}">
        <span class="bub-ico">${d ? FOLDER_GLYPH : ICONS[kindOf(k[0])]}</span>
        ${showText ? `<b>${esc(k[0])}</b>` : ''}${showSize ? `<span>${fmtBytes(k[1])}</span>` : ''}
      </div>${on ? `<span class="bub-chk">${ICONS.check}</span>` : ''}</button>`;
  });
  stage.innerHTML = html;
  stage.classList.remove('zoom-in', 'zoom-out'); void stage.offsetWidth;
  if (S.lensAnim) stage.classList.add(S.lensAnim === 'out' ? 'zoom-out' : 'zoom-in');
  S.lensAnim = null;
}

  $('#topCrumbs').innerHTML = crumbs(parts);
  $('.top-search').style.visibility = v.type === 'search' ? 'hidden' : 'visible';
  const content = $('#content');
  HOOKS = [];
  content.classList.remove('enter');
  content.innerHTML = v.type === 'volume' ? renderVolume() : v.type === 'search' ? renderSearch() : v.type === 'clean' ? renderClean() : v.type === 'projects' ? renderProjects() : renderLibrary();
  const hooks = HOOKS; HOOKS = []; hooks.forEach(h => h());

}
function countUps(){
  document.querySelectorAll('#content [data-count]').forEach(el => {
    const v = +el.dataset.v, type = el.dataset.count, t0 = performance.now() + 150, dur = 1200;
    const f = type === 'int' ? x => fmtInt(Math.round(x))
            : type === 'parts' ? x => { const [a,u] = bytesParts(x); return `${a}<small>${u}</small>`; }
            : x => fmtBytes(x);
    const step = now => {
      const k = Math.max(0, Math.min(1, (now - t0) / dur)), e = 1 - Math.pow(1 - k, 4);
      el.innerHTML = f(v * e || 0);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function setSel(volId, path, node){ S.sel = {volId, path: path.slice(), node}; }
function rowClick(l, i, dbl){
  const v = S.view;
  if (l === 'ilist-t'){
    const it = LISTS.ilist?.flat?.[i]; if (!it) return;
    if (dbl && isDir(it)){ v.path = v.path.concat(it[0]); S.sel = null; S.anim = false; return render(); }
    setSel(v.id, v.path, it); S.anim = false; return render();
  }
  const L = LISTS[l]; if (!L) return; const it = L.items[i]; if (!it) return;
  if (l === 'lenslist'){
    if (isDir(it)) return lensDrill(it[0]);
    toggleBinItem({v:v.id, p:v.path, n:it}); S.anim = false; return render();
  }
  if (l.startsWith('col')){
    const colPath = L.colPath;
    if (isDir(it)){ v.path = colPath.concat(it[0]); setSel(v.id, colPath, it); }
    else { v.path = colPath.slice(); setSel(v.id, colPath, it); }
    S.anim = false; render(); return;
  }
  if (l === 'blist'){
    if (dbl && isDir(it)){ v.path = v.path.concat(it[0]); S.sel = null; S.anim = false; render(); return; }
    setSel(v.id, v.path, it); S.anim = false; render(); return;
  }
  if (l === 'slist'){
    if (it.agg){ S.spaceExpand = !S.spaceExpand; render(); return; }
    if (isDir(it.k)){ v.path = v.path.concat(it.k[0]); S.sunAnim = true; S.spaceExpand = false; render(); return; }
    setSel(v.id, v.path, it.k); go({...v, mode:'browse'}, {keepSel:true}); return;
  }
  if (l === 'flist'){ setSel(v.id, it.p, it.n); go({...v, mode:'browse', path:it.p}, {keepSel:true}); return; }
  if (l === 'tlist'){ S.q = {...S.q, text:'.' + it.ext, kind:'tutti', vol:v.id}; go({type:'search'}); return; }
  if (l === 'clist'){
    const it2 = it.m || it.x; if (!it2) return;
    if (dbl) return go({type:'volume', id:it2.v, mode:'browse', path:it2.p.slice()}, {sel:{volId:it2.v, path:it2.p, node:it2.n}});

  }
  if (l === 'plist'){
    S.projSel = it.key;
    if (dbl) return go({type:'volume', id:it.v, mode:'browse', path:it.path.slice()});
    S.anim = false; return render();
  }
  if (l === 'qlist'){
    if (it.hdr) return;
    setSel(it.v, it.p, it.n);
    if (dbl){ gotoSel(); return; }
    updateSearchResults(); return;
  }
}

document.addEventListener('keydown', e => {
  if (!S.mode) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openSearch(); return; }
  const inField = /input|textarea|select/i.test(document.activeElement.tagName);
  if (e.key === '/' && !inField){ e.preventDefault(); openSearch(); return; }
  const v = S.view;
  if (v.type === 'search'){
    const res = S._searchResults || [];
    if (!res.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      const L = LISTS.qlist; if (!L) return;
      const items = L.items; let idx = S.sel ? items.findIndex(x => x.n === S.sel.node) : -1;
      const dir = e.key === 'ArrowDown' ? 1 : -1; let j = idx + dir;
      while (j >= 0 && j < items.length && items[j].hdr) j += dir;
      if (j < 0 || j >= items.length) return; idx = j;
      const it = items[idx];
      setSel(it.v, it.p, it.n); updateSearchResults();
      const el = LISTS.qlist.el, top = idx * 40; if (top < el.scrollTop) el.scrollTop = top; else if (top + 40 > el.scrollTop + el.clientHeight) el.scrollTop = top + 40 - el.clientHeight;
      return;
    }
    if (e.key === 'Enter' && S.sel){ e.preventDefault(); gotoSel(); }
    return;
  }
  if (v.type !== 'volume' || v.mode !== 'browse' || inField) return;
  const node = nodeAt(v.id, v.path); if (!node) return;
  const layout = innerWidth < 820 ? 'list' : S.browse.layout;
  const k = e.key;
  if (!['ArrowDown','ArrowUp','ArrowLeft','ArrowRight','Enter','Backspace'].includes(k)) return;
  e.preventDefault();
  if (layout === 'columns'){
    // la selezione vive nell'ultima colonna (o è la cartella aperta)
    let parentPath, siblings, cur;
    if (S.sel && S.sel.volId === v.id && !isDir(S.sel.node)){ parentPath = S.sel.path; }
    else if (v.path.length){ parentPath = v.path.slice(0,-1); }
    else parentPath = [];
    siblings = sortedKids(nodeAt(v.id, parentPath), S.browse.sort);
    cur = S.sel && S.sel.volId === v.id ? siblings.findIndex(x => x === S.sel.node) : -1;
    if (cur < 0 && v.path.length) cur = siblings.findIndex(x => x[0] === v.path[v.path.length-1]);
    if (k === 'ArrowDown' || k === 'ArrowUp'){
      const it = siblings[Math.max(0, Math.min(siblings.length-1, cur + (k === 'ArrowDown' ? 1 : -1)))]; if (!it) return;
      v.path = isDir(it) ? parentPath.concat(it[0]) : parentPath.slice(); setSel(v.id, parentPath, it);
    } else if (k === 'ArrowRight' || k === 'Enter'){
      const it = S.sel?.node; if (!it || !isDir(it) || !it[3].length) return;
      const first = sortedKids(it, S.browse.sort)[0]; const pp = parentPath.concat(it[0]);
      v.path = isDir(first) ? pp.concat(first[0]) : pp; setSel(v.id, pp, first);
    } else if (k === 'ArrowLeft' || k === 'Backspace'){
      if (!parentPath.length) return;
      const pp = parentPath.slice(0,-1); const it = nodeAt(v.id, pp)[3].find(x => x[0] === parentPath[parentPath.length-1]);
      v.path = parentPath.slice(); setSel(v.id, pp, it);
    }
  } else {
    const kids = sortedKids(node, S.browse.sort);
    let cur = S.sel && S.sel.volId === v.id ? kids.findIndex(x => x === S.sel.node) : -1;
    if (k === 'ArrowDown' || k === 'ArrowUp'){ const it = kids[Math.max(0, Math.min(kids.length-1, cur + (k === 'ArrowDown' ? 1 : -1)))]; if (it) setSel(v.id, v.path, it); }
    else if ((k === 'Enter' || k === 'ArrowRight') && S.sel && isDir(S.sel.node)){ v.path = v.path.concat(S.sel.node[0]); S.sel = null; }
    else if ((k === 'Backspace' || k === 'ArrowLeft') && v.path.length){ const name = v.path[v.path.length-1]; v.path = v.path.slice(0,-1); const it = nodeAt(v.id, v.path)[3].find(x => x[0] === name); setSel(v.id, v.path, it); }
  }
  S.anim = false; render();
});

async function reveal(){
  if (!S.sel && S.view.type === 'volume'){ const n = nodeAt(S.view.id, S.view.path); if (n) setSel(S.view.id, S.view.path.slice(0,-1), n); }

  const path = isRootNode ? '' : S.sel.path.concat(S.sel.node[0]).join('/');
  if (S.mode === 'native'){ const r = await N.call('reveal', {id: v.id, path}); if (!r.ok) toast(r.error); return; }

  try { await S.fb.sendReveal(v.id, path); toast('Inviato al Mac…'); }
  catch(err){ console.error(err); toast('Non sono riuscito a contattare il Mac'); }
}

/* ==========================================================================
   Caricamento cataloghi
   ========================================================================== */
async function ensureCatalog(id){
  const v = volById(id); if (!v) return;
  const key = v.lastScan ? v.lastScan.getTime() : 0;
  const have = S.catalogs.get(id);
  if (have && have.key === key) return;
  if (S.loading.has(id)) return;
  if (S.mode === 'demo'){ S.catalogs.set(id, {root: DEMO.trees[id], key, flat:null}); return; }
  if (!v.catalogPath) return;
  S.loading.add(id);
  try {
    const root = S.mode === 'native' ? await nativeCatalog(id) : await S.fb.loadCatalog(v.catalogPath);
    S.catalogs.set(id, {root, key, flat:null});
  } catch(err){ console.error('Catalogo', id, err); toast(`Non riesco a caricare l'indice di ${v.name}`); }
  finally { S.loading.delete(id); if (S.view.type === 'search') updateSearchResults(); else render(); }
}
async function nativeCatalog(id){
  const b64 = await N.call('getCatalog', {id});
  if (!b64) throw new Error('catalogo assente');
  return JSON.parse(await inflate(await (await fetch('data:application/octet-stream;base64,' + b64)).arrayBuffer())).root;
}
async function inflate(buf){
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(stream).text();
}

/* ==========================================================================
   Firebase (modalità live)
   ========================================================================== */
async function initFirebase(){
  const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
  const [{initializeApp}, A, F, ST] = await Promise.all([
    import(base+'firebase-app.js'), import(base+'firebase-auth.js'),
    import(base+'firebase-firestore.js'), import(base+'firebase-storage.js')
  ]);
  const app = initializeApp(firebaseConfig);
  const auth = A.getAuth(app), db = F.getFirestore(app), storage = ST.getStorage(app);
  let unsubVols = null;
  S.fb = {
    login: (e,p) => A.signInWithEmailAndPassword(auth, e, p),
    logout: () => A.signOut(auth),
    raw: {A, F, ST, auth, db, storage},
    async loadCatalog(path){
      const buf = await ST.getBytes(ST.ref(storage, path));
      return JSON.parse(await inflate(buf)).root;
    },
    async sendTrash(volumeId, paths){
      await F.addDoc(F.collection(db, 'users', auth.currentUser.uid, 'commands'), {type:'trash', volumeId, paths, status:'pending', createdAt:F.serverTimestamp()});
    },
    async sendReveal(volumeId, path){
      const ref = await F.addDoc(F.collection(db, 'users', auth.currentUser.uid, 'commands'),
        {type:'reveal', volumeId, path, status:'pending', createdAt:F.serverTimestamp()});
      const un = F.onSnapshot(ref, snap => {
        const s = snap.data()?.status;
        if (s === 'done'){ toast('Aperto nel Finder ✓'); un(); }
        else if (s === 'error'){ toast(snap.data().message || 'Il Mac non ha trovato il file'); un(); }
      });
      setTimeout(() => un(), 30000);
    }
  };
  A.onAuthStateChanged(auth, user => {
    if (N){   // nell'app per Mac l'account serve solo a sincronizzare
      S.user = user;
      if (user){ SYNC.start(user); if (!$('#login').hidden){ $('#login').hidden = true; $('#app').hidden = false; } }
      else SYNC.stop();
      updateWho(); return;
    }
    if (unsubVols){ unsubVols(); unsubVols = null; }
    if (!user){ S.mode = null; S.user = null; S.volumes = []; S.catalogs.clear(); showLogin(); return; }
    S.mode = 'live'; S.user = user;
    let first = true;
    unsubVols = F.onSnapshot(F.collection(db, 'users', user.uid, 'volumes'), snap => {
      const toDate = x => x?.toDate ? x.toDate() : (x ? new Date(x) : null);
      S.volumes = snap.docs.map(d => { const x = d.data(); return {id:d.id, ...x, lastSeen:toDate(x.lastSeen), lastScan:toDate(x.lastScan)}; })
        .sort((a,b) => (isOnline(b) - isOnline(a)) || a.name.localeCompare(b.name));
      S.volumes.forEach(v => ensureCatalog(v.id));
      if (S.view.type === 'volume' && !volById(S.view.id)) S.view = {type:'library'};
      if (first){ first = false; showApp(); } else if (S.view.type !== 'search') render();
    }, err => { console.error(err); toast('Errore di accesso ai dati: controlla le regole Firestore'); });
  });
}
setInterval(() => { if (S.mode === 'live' && S.view.type === 'library') render(); }, 60*1000);

/* ==========================================================================

function showLogin(){ $('#app').hidden = true; $('#login').hidden = false; }
function showApp(){
  $('#login').hidden = true; $('#app').hidden = false;

  updateWho();

}
function updateWho(){
  const who = S.mode === 'demo' ? 'Modalità demo' : S.mode === 'native' ? (S.user?.email || (S.native?.mac || 'Questo Mac')) : (S.user?.email || '');
  $('#who').textContent = who; $('#avatar').textContent = (who[0] || 'H').toUpperCase();

    $('#logoutBtn').title = S.user ? 'Scollega account' : 'Accedi per vedere i dischi anche dal sito';

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!CONFIGURED || !S.fb){ $('#loginErr').textContent = 'Firebase non disponibile: usa la demo.'; return; }
  const btn = $('#loginBtn'); btn.disabled = true; btn.style.opacity = .6; $('#loginErr').textContent = '';
  try { await S.fb.login($('#email').value.trim(), $('#password').value); }
  catch(err){
    const m = {'auth/invalid-credential':'Email o password non corrette','auth/too-many-requests':'Troppi tentativi, riprova tra poco','auth/network-request-failed':'Nessuna connessione'};
    $('#loginErr').textContent = m[err.code] || 'Accesso non riuscito';
  } finally { btn.disabled = false; btn.style.opacity = 1; }
});
$('#demoBtn').onclick = () => {
  if (S.mode === 'native'){ $('#login').hidden = true; $('#app').hidden = false; return; } S.mode = 'demo'; S.volumes = DEMO.volumes; S.catalogs.clear(); S.volumes.forEach(v => ensureCatalog(v.id)); showApp(); };
$('#logoutBtn').onclick = () => {
  if (S.mode === 'native'){
    if (S.user){ if (confirm('Scollegare l\'account? I dischi resteranno visibili qui, ma il sito non si aggiornerà più.')) S.fb.logout(); }
    else if (CONFIGURED && S.fb){ $('#app').hidden = true; $('#login').hidden = false; }
    else toast('Firebase non raggiungibile: riprova più tardi');
    return;
  } if (S.mode === 'demo'){ S.mode = null; S.volumes = []; S.catalogs.clear(); showLogin(); } else S.fb.logout(); };

/* ==========================================================================
   Dati demo (deterministici, ~45.000 file)
   ========================================================================== */
const DEMO = (() => {
  let seed = 11;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const ri = (a,b) => Math.floor(a + rnd()*(b-a+1));
  const now = Math.floor(Date.now()/1000);
  const pad = (n,l) => String(n).padStart(l,'0');
  const themes = {
    video:{ folders:[['Progetti 2026','Progetti 2025','Footage','Export finali','Musica e SFX','Template','Archivio clienti'],
                     ['Spot Natale','Videoclip “Mare”','Documentario','Reel Instagram','Cortometraggio','Evento aziendale','Aftermovie festival','Matrimonio Rossi'],
                     ['RAW','Proxy','Audio','Grafica','Export','Render Files'],['Giorno 1','Giorno 2','Camera A','Camera B','Drone']],
      files:[['mov',()=>`A00${ri(1,9)}_C${pad(ri(1,999),3)}.mov`,300e6,6e9,5],['mp4',()=>`Export_v${ri(1,40)}.mp4`,80e6,2e9,2],['wav',()=>`Audio_${pad(ri(1,999),3)}.wav`,20e6,400e6,2],['braw',()=>`Clip_${pad(ri(1,9999),4)}.braw`,1e9,9e9,2],['prproj',()=>`Montaggio_${ri(1,30)}.prproj`,5e6,60e6,.6],['png',()=>`Titolo_${ri(1,300)}.png`,1e6,15e6,1.4],['mxf',()=>`Camera_A_${pad(ri(1,999),3)}.mxf`,2e9,30e9,.4],['xml',()=>`timeline_${ri(1,60)}.xml`,1e5,3e6,.4]] },
    foto:{ folders:[['Archivio 2024','Archivio 2025','Archivio 2026','Clienti','Portfolio','Cataloghi Lightroom','Backup telefono'],
                    ['Concerto in piazza','Ritratti','Matrimonio','Paesaggi Puglia','Festival estate','Street Lecce','Studio','Notturne'],
                    ['RAW','JPG','Selezione','Export web','Stampa'],['Sessione 1','Sessione 2','Sessione 3','Scarti']],
      files:[['arw',()=>`DSC${pad(ri(1,99999),5)}.ARW`,22e6,48e6,8],['jpg',()=>`IMG_${pad(ri(1,9999),4)}.jpg`,3e6,14e6,5],['dng',()=>`DJI_${pad(ri(1,9999),4)}.DNG`,20e6,40e6,1],['psd',()=>`Ritocco_${ri(1,400)}.psd`,80e6,900e6,.6],['heic',()=>`IMG_${pad(ri(1,9999),4)}.HEIC`,1.5e6,4e6,1.5],['mov',()=>`Backstage_${ri(1,90)}.mov`,1e9,12e9,.25],['sparsebundle',()=>`Backup iPhone ${ri(1,6)}.sparsebundle`,30e9,90e9,.03],['lrdata',()=>`Catalogo ${ri(1,4)} Previews.lrdata`,3e9,25e9,.04]] },
    musica:{ folders:[['Logic Projects','Campioni','Bounce','Stems','Backup plugin','Podcast'],['Beat lo-fi','Colonna sonora','Remix','Jingle radio','Live 2025','EP “Notte”'],['Audio Files','Bounces','Freeze Files','Mix'],['Take','Versioni','Master']],
      files:[['wav',()=>`Take ${ri(1,900)}.wav`,10e6,300e6,6],['logicx',()=>`Progetto ${ri(1,120)}.logicx`,50e6,2e9,.6],['aif',()=>`Loop ${ri(1,2000)}.aif`,1e6,30e6,4],['mp3',()=>`Mix ${ri(1,300)}.mp3`,5e6,20e6,2],['zip',()=>`Libreria ${ri(1,40)}.zip`,200e6,4e9,.3],['mid',()=>`Melodia ${ri(1,400)}.mid`,1e3,50e3,1]] },
    docs:{ folders:[['Università','Documenti','Tesi','Lavoro','Varie'],['Reti','Crittografia','Sistemi operativi','Sicurezza web','Basi di dati','Appunti','Fatture','Contratti'],['Slide','Esercizi','Esami','Bozze'],['2025','2026']],
      files:[['pdf',()=>`Lezione ${ri(1,300)}.pdf`,500e3,25e6,6],['md',()=>`Appunti ${ri(1,500)}.md`,2e3,60e3,3],['docx',()=>`Relazione ${ri(1,90)}.docx`,50e3,5e6,2],['zip',()=>`Progetto_${ri(1,90)}.zip`,1e6,300e6,.6],['py',()=>`esercizio_${ri(1,400)}.py`,1e3,20e3,2],['key',()=>`Presentazione ${ri(1,50)}.key`,5e6,200e6,.6],['png',()=>`Schermata ${ri(1,900)}.png`,200e3,3e6,2]] }
  };
  function genTree(theme, rootName, maxDepth, leafRange){
    const T = themes[theme];
    const totalW = T.files.reduce((a,f)=>a+f[4],0);
    const pickFile = () => { let r = rnd()*totalW; for (const f of T.files){ r -= f[4]; if (r <= 0) return f; } return T.files[0]; };
    function folder(name, depth, age){
      if (depth === 1) age = rnd() < .35 ? ri(0, 40) : ri(60, 900);
      const kids = []; const used = new Set();
      if (depth < maxDepth){
        const pool = T.folders[Math.min(depth, T.folders.length-1)];
        const n = depth === 0 ? pool.length : ri(2, Math.min(4, pool.length));
        let names = pool;
        if (depth > 0){ names = pool.slice(); for (let i = names.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [names[i], names[j]] = [names[j], names[i]]; } names = names.slice(0, n); }
        for (const nm of names) kids.push(folder(nm, depth+1, age));
      }
      const nf = depth === 0 ? ri(1,3) : depth >= maxDepth ? ri(leafRange[0], leafRange[1]) : ri(1,8);
      for (let i=0;i<nf;i++){
        const f = pickFile(); let nm = f[1](); let g = 0;
        while (used.has(nm) && g++ < 4) nm = f[1]();
        if (used.has(nm)) continue; used.add(nm);
        kids.push([nm, Math.round(f[2] * Math.pow(f[3]/f[2], rnd())), now - (age || 0)*86400 - ri(3600, 86400*(age ? 45 : 700))]);
      }
      return [name, kids.reduce((a,k)=>a+k[1],0), kids.reduce((a,k)=>Math.max(a,k[2]),0), kids];
    }
    return folder(rootName, 0);
  }
  function scale(n, f){ n[1] = Math.round(n[1]*f); if (isDir(n)) n[3].forEach(k => scale(k, f)); }
  function count(n, acc={files:0,folders:0}){ for (const k of n[3]){ if (isDir(k)){ acc.folders++; count(k, acc); } else acc.files++; } return acc; }
  const specs = [
    {id:'demo-t7', name:'Samsung T7', color:'sage', totalBytes:1e12, usedPct:.71, format:'APFS', online:true, theme:'video', leaf:[20,70], scanAgo:2*3600},
    {id:'demo-lacie', name:'LaCie Rugged', color:'peach', totalBytes:2e12, usedPct:.83, format:'exFAT', online:true, theme:'foto', leaf:[60,160], scanAgo:26*3600},
    {id:'demo-sandisk', name:'SanDisk Extreme', color:'lavender', totalBytes:500e9, usedPct:.46, format:'APFS', online:false, theme:'musica', leaf:[25,80], scanAgo:9*86400},
    {id:'demo-usb', name:'Chiavetta Kingston', color:'sky', totalBytes:64e9, usedPct:.28, format:'MS-DOS (FAT32)', online:false, theme:'docs', leaf:[10,40], scanAgo:31*86400}
  ];
  const trees = {}, volumes = [];
  for (const s of specs){
    const root = genTree(s.theme, s.name, 4, s.leaf);
    scale(root, s.totalBytes * s.usedPct / root[1]);
    trees[s.id] = root;
  }
  // --- casi reali per "Libera spazio" e "Progetti" ---
  const clone = n => JSON.parse(JSON.stringify(n));
  const find = (root, path) => path.reduce((n, name) => n && n[3].find(k => k[0] === name && isDir(k)), root);
  const recalc = n => { if (!isDir(n)) return n[1]; n[1] = n[3].reduce((a,k) => a + recalc(k), 0); n[2] = n[3].reduce((a,k)=>Math.max(a,k[2]),0); return n[1]; };
  const T7 = trees['demo-t7'], LC = trees['demo-lacie'], SD = trees['demo-sandisk'], USB = trees['demo-usb'];
  // backup completo di una cartella del T7 sul LaCie (duplicato tra dischi)
  const p25 = find(T7, ['Progetti 2025']); if (p25) LC[3].push(['Backup T7', 0, 0, [clone(p25)]]);
  // stessa libreria musicale su due dischi
  const msfx = find(T7, ['Musica e SFX']); if (msfx){ const c = clone(msfx); c[0] = 'Musica e SFX'; SD[3].push(['Da T7', 0, 0, [c]]); }
  // foto consegnate copiate sulla chiavetta
  const ritr = LC[3].find(k => isDir(k) && k[0] === 'Portfolio'); const sm = ritr && ritr[3].filter(isDir).sort((a,b)=>a[1]-b[1])[0];
  if (sm){ const c = clone(sm); USB[3].push(['Foto da consegnare', 0, 0, [c]]); }
  // archivi già estratti
  const mkFiles = (prefix, ext, n, tot) => Array.from({length:n}, (_, i) => [`${prefix}_${pad(i+1,3)}.${ext}`, Math.round(tot/n * (0.6 + rnd()*0.8)), now - 86400*500 - i*3600]);
  const fo = find(T7, ['Footage']); if (fo){ const files = mkFiles('DJI', 'mp4', 36, 22e9); const sz = files.reduce((a,f)=>a+f[1],0); fo[3].push(['Drone 2024', 0, 0, files]); fo[3].push(['Drone 2024.zip', Math.round(sz*.97), now - 86400*520]); }
  const camp = find(SD, ['Campioni']); if (camp){ const files = mkFiles('Synth', 'wav', 60, 6e9); const sz = files.reduce((a,f)=>a+f[1],0); camp[3].push(['Libreria Synth', 0, 0, files]); camp[3].push(['Libreria Synth.zip', Math.round(sz*.9), now - 86400*800]); }
  // progetti di codice con dipendenze e build
  const lav = USB[3].find(k => isDir(k) && k[0] === 'Lavoro') || (USB[3].push(['Lavoro',0,0,[]]), USB[3][USB[3].length-1]);
  lav[3].push(['sito-portfolio', 0, 0, [
    ['package.json', 2e3, now - 86400*40], ['index.html', 12e3, now - 86400*40], ['src', 0, 0, mkFiles('component', 'js', 24, 2e6)],
    ['node_modules', 0, 0, Array.from({length:30}, (_, i) => [`pkg-${i+1}`, 0, 0, mkFiles('mod', 'js', 12, 12e6)])], ['dist', 0, 0, mkFiles('bundle', 'js', 6, 4e6)]]]);
  lav[3].push(['app-swift', 0, 0, [['Hangar.xcodeproj', 3e6, now - 86400*12], ['Sources', 0, 0, mkFiles('View', 'swift', 18, 1e6)], ['DerivedData', 0, 0, mkFiles('build', 'o', 40, 1.6e9)]]]);
  for (const id of Object.keys(trees)) recalc(trees[id]);
  for (const s of specs){
    const root = trees[s.id];
    const c = count(root);
    const scan = new Date(Date.now() - s.scanAgo*1000);
    volumes.push({id:s.id, name:s.name, color:s.color, totalBytes:s.totalBytes, freeBytes:Math.max(s.totalBytes*.02, s.totalBytes - root[1]), format:s.format,
      online:s.online, lastSeen: s.online ? new Date() : scan, lastScan:scan, fileCount:c.files, folderCount:c.folders, mac:'MacBook Pro', catalogPath:'demo'});
  }
  return {trees, volumes};
})();

/* ==========================================================================
   App per Mac: dati dal motore nativo, sincronizzazione facoltativa con Firebase
   ========================================================================== */
function applyNativeState(st){
  const toDate = ms => ms ? new Date(ms) : null;
  S.native = st;
  S.volumes = st.volumes.map(x => ({...x, lastSeen: toDate(x.lastSeen), lastScan: toDate(x.lastScan), catalogPath: x.hasCatalog ? 'native' : null}))
    .sort((a,b) => (isOnline(b) - isOnline(a)) || a.name.localeCompare(b.name));
  S.volumes.forEach(v => ensureCatalog(v.id));
  if (S.view.type === 'volume' && !volById(S.view.id)) S.view = {type:'library'};
}
async function startNative(){
  S.mode = 'native';
  $('#demoBtn').textContent = 'Continua senza account';
  $('#loginNote').textContent = 'Con l\'account vedi i dischi anche dal sito, da qualsiasi dispositivo.';
  let lastSig = '';
  const sig = () => JSON.stringify(S.volumes.map(v => [v.id, v.name, v.color, v.online, v.freeBytes, v.scanning == null, +v.lastScan || 0, v.hasCatalog]));
  N.on('state', st => {
    applyNativeState(st);
    const now = sig();
    if (now === lastSig){   // cambia solo il contatore della scansione: aggiorno le etichette senza ridisegnare
      S.volumes.forEach(v => document.querySelectorAll(`[data-scan="${CSS.escape(v.id)}"]`).forEach(el => el.innerHTML = `<span class="spin sm"></span>${scanLabel(v)}`));
    } else {
      lastSig = now;
      if (!$('#app').hidden && S.view.type !== 'search'){ S.anim = false; render(); }
    }
    SYNC.pushSoon();
  });
  N.on('scanned', () => SYNC.pushSoon());
  applyNativeState(await N.call('getState'));
  lastSig = sig();
  showApp();
  if (CONFIGURED) initFirebase().catch(err => console.warn('Firebase non raggiungibile', err));
}

const SYNC = {
  user: null, unsubCmd: null, timer: null, pending: null, busy: false, running: new Set(),
  start(user){
    this.stop(); this.user = user;
    this.push();
    this.timer = setInterval(() => this.push(), 5*60*1000);   // battito: il sito capisce che i dischi sono collegati
    const {F, db} = S.fb.raw;
    this.unsubCmd = F.onSnapshot(F.query(F.collection(db, 'users', user.uid, 'commands'), F.where('status', '==', 'pending')),
      snap => snap.docChanges().forEach(ch => { if (ch.type === 'added') this.run(ch.doc); }),
      err => console.warn('Comandi', err));
  },
  stop(){
    clearInterval(this.timer); this.timer = null;
    if (this.unsubCmd){ this.unsubCmd(); this.unsubCmd = null; }
    this.user = null;
  },
  pushSoon(){ if (!this.user) return; clearTimeout(this.pending); this.pending = setTimeout(() => this.push(), 2500); },
  async push(){
    if (!this.user || !S.native || this.busy) return;
    this.busy = true;
    const {F, ST, db, storage} = S.fb.raw, uid = this.user.uid;
    try {
      for (const v of S.native.volumes){
        const ref = F.doc(db, 'users', uid, 'volumes', v.id);
        const data = {name: v.name, color: v.color, totalBytes: v.totalBytes, freeBytes: v.freeBytes, format: v.format,
          online: v.online, fileCount: v.fileCount, folderCount: v.folderCount, mac: v.mac};
        if (v.online) data.lastSeen = F.serverTimestamp();
        else if (v.lastSeen) data.lastSeen = F.Timestamp.fromMillis(v.lastSeen);
        await F.setDoc(ref, data, {merge: true});
        // l'indice va caricato solo quando cambia; la data della scansione si scrive dopo, così il sito non legge un file a metà
        const key = `hangar-up-${uid}-${v.id}`;
        if (v.hasCatalog && v.lastScan && store.get(key, 0) !== v.lastScan){
          const b64 = await N.call('getCatalog', {id: v.id});
          if (!b64) continue;
          const bytes = new Uint8Array(await (await fetch('data:application/octet-stream;base64,' + b64)).arrayBuffer());
          const path = `users/${uid}/volumes/${v.id}/catalog.json.deflate`;
          await ST.uploadBytes(ST.ref(storage, path), bytes, {contentType: 'application/octet-stream'});
          await F.setDoc(ref, {catalogPath: path, lastScan: F.Timestamp.fromMillis(v.lastScan)}, {merge: true});
          store.set(key, v.lastScan);
        }
      }
    } catch(err){ console.warn('Sincronizzazione', err); }
    finally { this.busy = false; }
  },
  // Comandi arrivati dal sito: aprire nel Finder o spostare nel Cestino (con conferma sul Mac)
  async run(d){
    if (this.running.has(d.id)) return;
    this.running.add(d.id);
    const {F} = S.fb.raw, c = d.data();
    try {
      const age = c.createdAt?.toMillis ? Date.now() - c.createdAt.toMillis() : 0;
      if (age > 30*60*1000){ await F.updateDoc(d.ref, {status: 'expired'}); return; }
      await F.updateDoc(d.ref, {status: 'running'});
      let r;
      if (c.type === 'reveal') r = await N.call('reveal', {id: c.volumeId, path: c.path || ''});
      else if (c.type === 'trash') r = await N.call('trash', {id: c.volumeId, paths: Array.isArray(c.paths) ? c.paths : []});
      else r = {ok: false, error: 'Comando sconosciuto'};
      await F.updateDoc(d.ref, r.ok ? {status: 'done', doneAt: F.serverTimestamp()} : {status: 'error', message: r.error || 'Errore'});
    } catch(err){ console.warn('Comando', err); }
  }
};

applyTheme();
if (N) startNative();
else {
showLogin();
if (CONFIGURED){
  initFirebase().catch(err => { console.error(err); $('#loginNote').textContent = 'Firebase non raggiungibile: puoi provare la demo.'; });
} else {
  $('#loginNote').textContent = 'Firebase non ancora configurato — puoi esplorare la demo.';
}
}
