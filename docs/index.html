<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangar — i tuoi dischi</title>
<meta name="theme-color" content="#F4F4F7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2397C9AE'/%3E%3Cstop offset='1' stop-color='%23A99BE6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Cpath d='M14 34 32 20l18 14v12H14z' fill='none' stroke='white' stroke-width='4.5' stroke-linejoin='round'/%3E%3Cpath d='M24 46v-8h16v8' fill='none' stroke='white' stroke-width='4.5' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F4F4F7; --panel:#FFFFFF; --panel-2:#F7F7FA; --hover:rgba(0,0,0,.04); --active:rgba(0,0,0,.065);
  --side:rgba(250,250,252,.72); --line:rgba(0,0,0,.07); --line-2:rgba(0,0,0,.11);
  --text:#1D1D1F; --muted:#6E6E73; --faint:#A1A1A6; --sel:#DCE9F9; --sel-text:#1D1D1F;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(20,20,40,.05);
  --shadow-lg:0 30px 80px rgba(20,20,40,.18),0 2px 8px rgba(0,0,0,.06);
  --r:18px;
  --sage:#7DB898; --lavender:#A394E4; --peach:#EFA67C; --sky:#7EB0E4; --rose:#E795B0; --butter:#E0C064; --mint:#72C3BC;
  --ok:#5FAE84; --bad:#E07A72;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;
}
[data-theme="dark"]{
  --bg:#0E0E10; --panel:#18181B; --panel-2:#1E1E22; --hover:rgba(255,255,255,.05); --active:rgba(255,255,255,.08);
  --side:rgba(22,22,25,.72); --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --text:#F5F5F7; --muted:#9C9CA3; --faint:#5F5F66; --sel:#28354A; --sel-text:#F5F5F7;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.25);
  --shadow-lg:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 500px at 105% -10%, color-mix(in srgb,var(--lavender) 16%,transparent), transparent 60%),
    radial-gradient(800px 500px at 20% -20%, color-mix(in srgb,var(--sage) 16%,transparent), transparent 60%),
    radial-gradient(700px 500px at 90% 110%, color-mix(in srgb,var(--peach) 10%,transparent), transparent 60%);}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block}
[hidden]{display:none!important}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.num{font-variant-numeric:tabular-nums}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Login ---------- */
#login{position:relative;z-index:1;height:100%;display:grid;place-items:center;padding:24px}
.login-card{width:min(400px,100%);background:var(--panel);border-radius:26px;padding:38px 34px 30px;box-shadow:var(--shadow-lg);text-align:center}
.logo{width:64px;height:64px;border-radius:17px;margin:0 auto 18px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--sage),var(--lavender));box-shadow:0 10px 30px color-mix(in srgb,var(--lavender) 40%,transparent);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px)}}
.logo svg{width:34px;height:34px}
.login-card h1{font-size:26px;letter-spacing:-.02em;font-weight:700}
.login-card p{color:var(--muted);margin:6px 0 24px}
.field{display:block;width:100%;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-2);padding:0 14px;margin-bottom:10px;outline:none;transition:border-color .15s,box-shadow .15s}
.field:focus{border-color:color-mix(in srgb,var(--sky) 70%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--sky) 22%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border-radius:9px;font-weight:600;font-size:13px;transition:transform .08s,background .15s,opacity .15s,box-shadow .25s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--text);color:var(--bg);width:100%;height:44px;margin-top:6px;font-size:14px;border-radius:11px}
.btn-primary:hover{box-shadow:0 8px 22px color-mix(in srgb,var(--lavender) 40%,transparent)}
.btn-ghost{background:var(--hover)}
.btn-ghost:hover{background:var(--active)}
.btn[disabled]{opacity:.4;cursor:default}
.btn-demo{width:100%;margin-top:10px;height:44px;color:var(--muted);border-radius:11px;font-size:14px}
.btn-demo:hover{color:var(--text);background:var(--hover)}
.login-err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.login-note{font-size:12px;color:var(--faint);margin-top:18px}

/* ---------- Shell ---------- */
#app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:256px minmax(0,1fr)}
.sidebar{background:var(--side);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;align-items:center;gap:10px;padding:18px 18px 12px}
.side-head .logo{width:30px;height:30px;border-radius:9px;margin:0;box-shadow:none;animation:none}
.side-head .logo svg{width:17px;height:17px}
.side-head b{font-size:16px;letter-spacing:-.01em}
.demo-badge{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:color-mix(in srgb,var(--butter) 28%,transparent);color:color-mix(in srgb,var(--butter) 55%,var(--text))}
.side-scroll{flex:1;overflow:auto;padding:4px 10px 10px;position:relative}
#sideNav{display:contents}
.side-label{font-size:11px;font-weight:600;color:var(--faint);padding:14px 10px 6px;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border-radius:10px;text-align:left;transition:background .12s;position:relative;z-index:1}
.nav-item:hover{background:var(--hover)}
.nav-item .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.nav-item .ico svg{width:15px;height:15px}
.nav-item .t{flex:1;min-width:0}
.nav-item .t b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .t span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item kbd{font-family:var(--font);font-size:10.5px;padding:1px 5px;border-radius:5px;border:1px solid var(--line-2);color:var(--faint)}
.nav-item.offline .t b{color:var(--muted)}
.nav-item.offline .mini-ring{opacity:.45;filter:saturate(.3)}
.mini-ring{width:26px;height:26px;flex:none;transition:transform .5s cubic-bezier(.2,.9,.3,1.3)}
.nav-item:hover .mini-ring{transform:rotate(25deg)}
.nav-pill{position:absolute;left:10px;right:10px;top:0;border-radius:10px;background:var(--active);pointer-events:none;opacity:0;
  transition:transform .45s cubic-bezier(.2,.9,.25,1.12),height .45s cubic-bezier(.2,.9,.25,1.12),opacity .2s}
.fav-star{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--butter);background:color-mix(in srgb,var(--butter) 16%,transparent)}
.fav-star svg{width:14px;height:14px}
.side-empty{font-size:12px;color:var(--faint);padding:2px 10px 6px}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--peach),var(--rose));flex:none}
.side-foot .who{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.on{color:var(--butter)}

main{min-width:0;min-height:0;display:flex;flex-direction:column}
.topbar{flex:none;display:flex;align-items:center;gap:12px;height:52px;padding:0 24px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:1;overflow:hidden}
.crumb{padding:4px 7px;border-radius:7px;white-space:nowrap;color:var(--muted);font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis;flex:none}
.crumb:hover{background:var(--hover);color:var(--text)}
.crumb.cur{color:var(--text);font-weight:600}
.crumb-sep{color:var(--faint);flex:none}
.crumb-sep svg{width:11px;height:11px}
.top-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:9px;background:var(--hover);color:var(--muted);min-width:220px;font-size:13px}
.top-search:hover{background:var(--active)}
.top-search svg{width:14px;height:14px}
.top-search kbd{margin-left:auto;font-family:var(--font);font-size:10.5px;padding:1px 5px;border-radius:5px;border:1px solid var(--line-2);color:var(--faint)}
#content{flex:1;min-height:0;position:relative}
.page{height:100%;overflow:auto;scroll-behavior:smooth}
.page-inner{padding:10px 28px 48px;max-width:1280px}
.fill{height:100%;display:flex;flex-direction:column;padding:16px 20px 18px;gap:14px;min-height:0}
.page-title{font-size:30px;font-weight:700;letter-spacing:-.025em;margin:14px 0 4px}
.page-sub{color:var(--muted);margin-bottom:24px}
.section-title{font-size:18px;font-weight:650;letter-spacing:-.015em;margin:32px 0 14px;display:flex;align-items:center;gap:10px}
.section-title .r{margin-left:auto;font-size:13px;font-weight:500}
.card{background:color-mix(in srgb,var(--panel) 84%,transparent);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}

/* ---------- Riflesso ---------- */
.sheen{position:relative}
.sheen::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--c,var(--sky)) 20%,transparent),transparent 55%)}
.sheen:hover::after{opacity:1}

/* ---------- Libreria ---------- */
.summary{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:14px}
.stat{padding:18px 20px}
.stat .k{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.stat .v small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.stackbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--hover);gap:2px}
.stackbar i{display:block;height:100%;border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:3px;display:inline-block}
.legend b{color:var(--text);font-weight:600}
.vol-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.vol-card{position:relative;padding:18px;border-radius:var(--r);background:color-mix(in srgb,var(--panel) 84%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .3s;overflow:hidden}
.vol-card::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 14%,transparent),transparent 55%);pointer-events:none}
.vol-card:hover{transform:translateY(-3px);box-shadow:var(--shadow),0 16px 40px color-mix(in srgb,var(--c) 20%,transparent)}
.vol-card.offline::before{background:linear-gradient(160deg,var(--hover),transparent 55%)}
.vol-card .top{display:flex;align-items:flex-start;gap:14px;position:relative}
.ring{width:74px;height:74px;flex:none;position:relative}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700;letter-spacing:-.02em}
.ring svg{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.vol-card:hover .ring svg{transform:rotate(-90deg) scale(1.06)!important}
.vol-card.offline .ring{filter:saturate(.15);opacity:.7}
.vol-card h3{font-size:16px;font-weight:650;letter-spacing:-.01em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vol-card .meta{font-size:12px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%}
.pill.on{background:color-mix(in srgb,var(--ok) 14%,transparent);color:color-mix(in srgb,var(--ok) 70%,var(--text))}
.pill.on i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.pill.off{background:var(--hover);color:var(--muted)}
.pill.off i{background:var(--faint)}
.vol-card .pill{margin-top:8px}
.bar{height:6px;border-radius:4px;background:var(--hover);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:4px;background:var(--c)}
.vol-card .bar{margin:18px 0 8px}
.vol-card .nums{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);position:relative}
.vol-card .nums b{color:var(--text);font-weight:600}

/* ---------- Cartelle di vetro ---------- */
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.folder-card{position:relative;padding:20px 12px 16px;border-radius:var(--r);text-align:center;transition:background .3s,transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.folder-card:hover{background:color-mix(in srgb,var(--panel) 72%,transparent);transform:translateY(-3px);box-shadow:var(--shadow)}
.folder-card:active{transform:translateY(-1px) scale(.98)}
.folder-card b{display:block;font-weight:600;font-size:13.5px;margin-top:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
.folder-card .fc-sub{display:block;font-size:12px;color:var(--muted);margin-top:2px;position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder{position:relative;width:148px;height:114px;margin:0 auto;perspective:620px;z-index:1}
.f-back{position:absolute;left:0;right:0;top:12px;bottom:0;border-radius:13px;
  background:linear-gradient(172deg,color-mix(in srgb,var(--c) 82%,#000 18%),color-mix(in srgb,var(--c) 62%,#000 38%));
  box-shadow:0 12px 26px color-mix(in srgb,var(--c) 30%,transparent);transition:box-shadow .45s}
.f-back::before{content:"";position:absolute;left:0;top:-10px;width:44%;height:22px;border-radius:9px 13px 0 0;background:color-mix(in srgb,var(--c) 82%,#000 18%)}
.f-paper{position:absolute;left:17px;right:17px;top:6px;height:76px;border-radius:7px;background:#FCFCFE;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 5px 12px rgba(0,0,0,.07);transition:transform .55s cubic-bezier(.2,.9,.25,1.2)}
.f-paper::before{content:"";position:absolute;left:12px;right:34px;top:12px;height:34px;border-radius:2px;background:repeating-linear-gradient(180deg,rgba(0,0,0,.085) 0 3px,transparent 3px 9px)}
.f-paper::after{content:"";position:absolute;right:11px;top:11px;width:14px;height:14px;border-radius:4px;background:var(--c);opacity:.5}
.f-paper.p1{transform:rotate(-6deg) translateX(-7px)}
.f-paper.p2{transform:rotate(5deg) translateX(9px);background:#F3F3F7;transition-delay:.03s}
.f-paper.p3{transition-delay:.06s}
.f-front{position:absolute;left:0;right:0;bottom:0;height:76px;border-radius:13px;transform-origin:50% 100%;overflow:hidden;
  transition:transform .55s cubic-bezier(.2,.8,.2,1),box-shadow .55s;
  background:linear-gradient(180deg,rgba(255,255,255,.52),rgba(255,255,255,.12) 70%),color-mix(in srgb,var(--c) 16%,transparent);
  backdrop-filter:blur(7px) saturate(190%);-webkit-backdrop-filter:blur(7px) saturate(190%);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -14px 26px color-mix(in srgb,var(--c) 20%,transparent),0 6px 16px rgba(0,0,0,.08)}
.f-front::after{content:"";position:absolute;inset:-50% -30%;background:linear-gradient(112deg,transparent 42%,rgba(255,255,255,.6) 50%,transparent 58%);transform:translateX(-70%);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.f-dots{position:absolute;right:9px;top:9px;display:flex;gap:4px}
.f-dots i{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.8);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.f-dots i::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--k)}
.f-size{position:absolute;left:11px;bottom:9px;font-size:12.5px;font-weight:700;letter-spacing:-.01em;color:color-mix(in srgb,var(--c) 40%,#1d1d1f);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--c) 55%,transparent);text-underline-offset:3px}
.folder-card:hover .f-front,.insp-folder:hover .f-front{transform:rotateX(-26deg) translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 18px 30px rgba(0,0,0,.14)}
.folder-card:hover .f-front::after,.insp-folder:hover .f-front::after{transform:translateX(70%)}
.folder-card:hover .f-back{box-shadow:0 18px 36px color-mix(in srgb,var(--c) 42%,transparent)}
.folder-card:hover .p1,.insp-folder:hover .p1{transform:rotate(-12deg) translate(-18px,-16px)}
.folder-card:hover .p2,.insp-folder:hover .p2{transform:rotate(10deg) translate(18px,-13px)}
.folder-card:hover .p3,.insp-folder:hover .p3{transform:translateY(-22px)}
[data-theme="dark"] .f-front{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.06) 70%),color-mix(in srgb,var(--c) 22%,transparent);border-color:rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px rgba(0,0,0,.35)}
[data-theme="dark"] .f-size{color:#fff;text-decoration-color:rgba(255,255,255,.4)}
[data-theme="dark"] .f-paper{background:#ECECF1} [data-theme="dark"] .f-paper.p2{background:#DCDCE3}
[data-theme="dark"] .f-dots i{background:rgba(255,255,255,.2)}
[data-theme="dark"] .folder-card:hover{background:rgba(255,255,255,.04)}

/* ---------- Tabelle semplici (Libreria) ---------- */
.table{width:100%;border-collapse:collapse}
.table th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:8px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr{transition:background .1s;cursor:pointer}
.table tbody tr:hover{background:var(--hover)}

/* ---------- Icone file ---------- */
.fi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;transition:transform .35s cubic-bezier(.2,.9,.3,1.4)}
.fi svg{width:16px;height:16px}
.fi.sm{width:22px;height:22px;border-radius:6px}
.fi.sm svg{width:13px;height:13px}
.fname{display:flex;align-items:center;gap:11px;min-width:0}
.fname .nm{min-width:0}
.fname .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fname .nm span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vol-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;min-width:0}
.vol-tag i{width:8px;height:8px;border-radius:50%;flex:none}

/* ---------- Testata disco ---------- */
.vhead{display:flex;align-items:center;gap:18px;padding:14px 18px;flex:none;overflow:hidden}
.vhead::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(500px 200px at 0% 0%,color-mix(in srgb,var(--c) 18%,transparent),transparent 70%);pointer-events:none}
.vhead .ring{width:58px;height:58px}
.vhead .ring .pct{font-size:13px}
.vhead .vt{min-width:0;position:relative}
.vhead h1{font-size:21px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.vhead .sub{color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vstats{display:flex;gap:22px;margin-left:auto;position:relative;flex:none}
.vstats div{min-width:0}
.vstats .k{font-size:11px;color:var(--muted)}
.vstats .v{font-size:15px;font-weight:650;margin-top:1px;white-space:nowrap}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--hover);position:relative;flex:none}
.seg button{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);transition:color .2s}
.seg button svg{width:14px;height:14px}
.seg button.on{color:var(--text)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:0;border-radius:8px;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform .4s cubic-bezier(.2,.9,.25,1.12),width .4s cubic-bezier(.2,.9,.25,1.12)}
[data-theme="dark"] .seg .thumb{background:#2C2C31}
.offline-note{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;background:var(--hover);color:var(--muted);font-size:12.5px;flex:none}
.offline-note svg{width:15px;height:15px;flex:none}

/* ---------- Area con Inspector ---------- */
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
.pane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex:none;min-width:0}
.pane-h .crumbs{flex:1}
.mini-input{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:8px;background:var(--hover);color:var(--muted);width:180px;flex:none}
.mini-input svg{width:13px;height:13px;flex:none}
.mini-input input{border:0;background:none;outline:none;width:100%;font-size:12.5px;color:var(--text)}
.sel-box{height:28px;border-radius:8px;border:0;background:var(--hover);padding:0 8px;font-size:12.5px;outline:none;cursor:pointer;flex:none}
.sel-box:hover{background:var(--active)}
.pane-foot{flex:none;padding:7px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);display:flex;gap:14px}

/* ---------- Liste virtualizzate ---------- */
.vl{overflow:auto;flex:1;min-height:0;position:relative;outline:none}
.vl-in{position:relative;box-sizing:border-box}
.row{display:grid;align-items:center;gap:12px;padding:0 14px;cursor:default;user-select:none;border-radius:8px;margin:0 6px;transition:background .08s}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel);color:var(--sel-text)}
.row.sel .muted,.row.sel .sub{color:color-mix(in srgb,var(--sel-text) 60%,transparent)}
.row:hover .fi{transform:scale(1.1) rotate(-4deg)}
.row .nm{min-width:0;display:flex;flex-direction:column}
.row .nm b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm b mark{background:color-mix(in srgb,var(--butter) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.row .sz{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .pathc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.row.ghdr{background:none!important;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;gap:8px;padding-top:8px}
.row.ghdr i{width:8px;height:8px;border-radius:50%}
.row.ghdr span{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.thead{display:grid;align-items:center;gap:12px;padding:0 20px;height:32px;font-size:11.5px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);flex:none}
.thead button{text-align:left;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.thead button:hover{color:var(--text)}
.thead button.r{justify-content:flex-end}
.szbar{display:flex;align-items:center;gap:8px;min-width:0}
.szbar .sb{flex:1;height:4px;border-radius:3px;background:var(--hover);overflow:hidden;min-width:30px}
.szbar .sb i{display:block;height:100%;border-radius:3px}
.szbar span{width:64px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* Colonne stile Finder */
.cols{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth}
.col{width:250px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;animation:colIn .35s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes colIn{from{opacity:0;transform:translateX(-10px)}}
.col .vl{padding:4px 0}
.crow{grid-template-columns:22px minmax(0,1fr) auto 10px;gap:8px;height:30px;padding:0 8px;margin:0 5px}
.crow .sz{font-size:11.5px;color:var(--muted)}
.crow .chev{color:var(--faint)}
.crow .chev svg{width:10px;height:10px}
.crow.sel .chev{color:inherit}
.col-end{flex:1;min-width:40px}

/* ---------- Inspector ---------- */
.insp{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.insp-scroll{overflow:auto;flex:1;padding:18px}
.insp-hero{text-align:center;padding:4px 0 14px}
.insp-folder{transform:scale(.82);margin:-8px auto -10px}
.insp-icon{width:84px;height:84px;border-radius:22px;margin:6px auto 4px;display:grid;place-items:center}
.insp-icon svg{width:40px;height:40px}
.insp h2{font-size:16px;font-weight:650;letter-spacing:-.01em;margin-top:10px;word-break:break-word}
.insp .kind{font-size:12px;color:var(--muted);margin-top:2px}
.insp .bigsize{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:12px}
.insp .share{font-size:11.5px;color:var(--muted);margin-top:2px}
.insp .bar{margin:8px 0 0}
.kv{margin-top:16px;border-top:1px solid var(--line)}
.kv div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{min-width:0;word-break:break-word}
.pathbox{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5;background:var(--hover);border-radius:8px;padding:8px 10px;margin-top:4px;word-break:break-all}
.insp-actions{display:grid;gap:8px;margin-top:16px}
.insp-actions .btn{width:100%;height:34px;justify-content:flex-start;padding:0 12px}
.insp-actions .btn.main{background:var(--text);color:var(--bg)}
.insp-actions .btn.main:hover{box-shadow:0 8px 22px color-mix(in srgb,var(--sky) 40%,transparent)}
.insp-close{display:none}

/* ---------- Spazio ---------- */
.space{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sun-card{display:flex;flex-direction:column;min-height:0}
.sun-wrap{position:relative;flex:1;min-height:0;display:grid;place-items:center;padding:8px 16px 16px}
.sun-wrap svg{width:min(100%,460px);max-height:100%;height:auto}
.sun-wrap path{cursor:pointer;stroke:var(--panel);stroke-width:1.5;transform-box:view-box;transform-origin:50% 50%;transition:opacity .25s,filter .2s,transform .35s cubic-bezier(.2,.9,.3,1.3)}
.sun-wrap svg.dim path{opacity:.28}
.sun-wrap svg.dim path.hot{opacity:1;filter:brightness(1.05) saturate(1.15)}
.sun-wrap path:hover{transform:scale(1.02)}
.sun-wrap circle.agg{fill:var(--hover)}
.sun-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:120px;height:120px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .2s}
.sun-center.up{cursor:pointer}
.sun-center.up:hover{background:var(--hover)}
.sun-center b{display:block;font-size:20px;letter-spacing:-.02em}
.sun-center span{display:block;font-size:11.5px;color:var(--muted);max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sun-center em{font-style:normal;font-size:10.5px;color:var(--faint);margin-top:3px;opacity:0;transition:opacity .2s}
.sun-center.up:hover em{opacity:1}
.tabs{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--hover);flex:none}
.tabs button{height:26px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
[data-theme="dark"] .tabs button.on{background:#2C2C31}
.srow{grid-template-columns:12px minmax(0,1fr) 90px 70px;height:38px}
.srow .sw{width:12px;height:12px;border-radius:4px}
.srow.hot{background:var(--hover)}
.srow.agg .nm b{color:var(--muted)}
.frow{grid-template-columns:30px minmax(0,1fr) 72px 46px;height:46px}
.trow{grid-template-columns:30px minmax(0,1fr) 70px 150px;height:42px}
.ext-badge{width:30px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:9.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.pct{font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.kinds-top{padding:12px 16px 4px;flex:none}

/* ---------- Cerca ---------- */
.search-head{padding:16px 18px 12px;flex:none}
.big-search{display:flex;align-items:center;gap:12px;height:50px;padding:0 16px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line-2);transition:border-color .2s,box-shadow .2s}
.big-search:focus-within{border-color:color-mix(in srgb,var(--sky) 70%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--sky) 18%,transparent)}
.big-search svg{width:20px;height:20px;color:var(--muted);flex:none}
.big-search input{flex:1;border:0;background:none;outline:none;font-size:18px;letter-spacing:-.01em}
.big-search .clear{color:var(--faint)}
.chips{display:flex;gap:6px;margin-top:12px;overflow-x:auto;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:20px;font-size:12.5px;font-weight:500;background:var(--hover);white-space:nowrap;color:var(--muted);transition:background .15s,color .15s}
.chip:hover{background:var(--active);color:var(--text)}
.chip.on{background:var(--text);color:var(--bg)}
.chip i{width:7px;height:7px;border-radius:50%}
.chips .sep{width:1px;height:18px;background:var(--line-2);margin:0 4px}
.qrow{grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) 130px 76px 96px;height:40px}
.qhead{grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) 130px 76px 96px}
.suggest{padding:18px;overflow:auto}
.suggest h3{font-size:13px;font-weight:600;color:var(--muted);margin:4px 0 10px}
.sug-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:22px}
.sug{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--hover);text-align:left;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s}
.sug:hover{background:var(--active);transform:translateY(-2px)}
.sug .fi{width:34px;height:34px;border-radius:10px}
.sug b{display:block;font-weight:600;font-size:13px}
.sug span{display:block;font-size:11.5px;color:var(--muted)}
.recent{display:flex;flex-wrap:wrap;gap:8px}

.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:50px;color:var(--muted)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--text);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--panel);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);border-radius:10px;padding:8px 11px;font-size:12px;transform:translate(-50%,calc(-100% - 12px));white-space:nowrap}
.tip b{display:block;font-size:12.5px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:60;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:500;font-size:13px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.2,.9,.3,1.2);max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}


/* ---------- Libera spazio / Progetti ---------- */
.clean-head{padding:18px 20px 16px;flex:none}
.ch-top{display:flex;align-items:flex-start;gap:16px;justify-content:space-between}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
.cat{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);text-align:left;transition:border-color .2s,background .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.cat:hover{transform:translateY(-1px);border-color:var(--line-2)}
.cat.on{background:color-mix(in srgb,var(--c) 12%,var(--panel));border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 6px 20px color-mix(in srgb,var(--c) 18%,transparent)}
.cat .fi{width:38px;height:38px;border-radius:11px}
.cat .fi svg{width:19px;height:19px}
.cat span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.cat b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.cat em{display:block;font-style:normal;font-size:11.5px;color:var(--faint)}
.cat-desc{flex:1;font-size:12.5px;color:var(--muted);line-height:1.45}
.crow-h{grid-template-columns:30px minmax(0,1fr) auto auto;background:var(--panel-2);margin-top:0}
.crow-h:hover{background:var(--panel-2)}
.crow-h .gain,.ghdr2 .gain{font-weight:700;color:color-mix(in srgb,var(--ok) 75%,var(--text));font-variant-numeric:tabular-nums}
.ghdr2{grid-template-columns:30px minmax(0,1fr) auto auto;background:var(--panel-2)}
.ghdr2:hover{background:var(--panel-2)}
.ghdr2 .nm .sub{white-space:normal;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.crow-m{grid-template-columns:22px minmax(0,1fr) 130px 70px 30px}
.crow-m.dupm{grid-template-columns:30px 140px minmax(0,1fr) 84px 30px}
.crow-m .pathc{direction:rtl;text-align:left}
.crow-m.binned{opacity:.55}
.crow-m.binned .nm b{text-decoration:line-through;text-decoration-color:var(--faint)}
.keep{font-size:11px;font-weight:600;color:color-mix(in srgb,var(--ok) 75%,var(--text));background:color-mix(in srgb,var(--ok) 14%,transparent);padding:2px 8px;border-radius:20px;justify-self:start;white-space:nowrap}
.add-btn{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--muted);background:var(--hover);transition:background .15s,color .15s,transform .2s cubic-bezier(.2,.9,.3,1.4)}
.add-btn:hover{background:var(--active);color:var(--text);transform:scale(1.08)}
.add-btn.on{background:color-mix(in srgb,var(--ok) 22%,transparent);color:color-mix(in srgb,var(--ok) 80%,var(--text))}
.add-btn svg{width:13px;height:13px}
.btn.sm{height:28px;font-size:12px;padding:0 10px}
.btn.done{color:color-mix(in srgb,var(--ok) 80%,var(--text))}
.btn.wide{width:100%;margin-top:8px;justify-content:center}
.bin{display:flex;flex-direction:column;min-height:0;padding:18px}
.bin-head{display:flex;align-items:center;gap:12px}
.bin-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(140deg,color-mix(in srgb,var(--ok) 30%,transparent),color-mix(in srgb,var(--sky) 26%,transparent));color:color-mix(in srgb,var(--ok) 70%,var(--text))}
.bin-icon svg{width:22px;height:22px}
.bin h2{font-size:16px;font-weight:650}
.bin .kind{font-size:12px;color:var(--muted)}
.bin-total{margin:16px 0 10px;padding:14px;border-radius:14px;background:var(--hover);text-align:center}
.bin-total b{display:block;font-size:28px;font-weight:700;letter-spacing:-.03em}
.bin-total span{font-size:12px;color:var(--muted)}
.bin-list{flex:1;min-height:0;overflow:auto;margin:0 -6px;padding:0 6px}
.bin-row{display:grid;grid-template-columns:22px minmax(0,1fr) 28px;align-items:center;gap:9px;padding:6px 4px;border-radius:8px;animation:rise .3s cubic-bezier(.2,.8,.2,1) backwards}
.bin-row:hover{background:var(--hover)}
.bin-row .nm{min-width:0;display:flex;flex-direction:column}
.bin-row .nm b{font-weight:500;font-size:12.5px}
.bin-row .nm span{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.bin-row .nm span i{width:6px;height:6px;border-radius:50%;flex:none}
.bin-row .icon-btn{width:24px;height:24px}
.bin-row .icon-btn svg{width:12px;height:12px}
.bin-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:20px 8px;line-height:1.5}
.bin-note{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--muted);padding:8px 2px}
.bin-note svg{width:14px;height:14px;flex:none;margin-top:1px}
.bin-actions{display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.bin-actions .btn{width:100%;height:36px}
.bin-go{background:var(--text);color:var(--bg);height:36px;width:100%;font-size:13px}
.bin-go:hover{box-shadow:0 8px 22px color-mix(in srgb,var(--ok) 35%,transparent)}
.prow{grid-template-columns:34px minmax(0,1.5fr) 130px 150px 96px 112px}
.prow .fi{width:32px;height:32px}
.flags{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:flex-start}
.st-pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 60%,var(--text));white-space:nowrap}
.flag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);background:var(--hover);padding:1px 6px;border-radius:6px;white-space:nowrap}
.flag svg{width:10px;height:10px}
.st-seg{display:flex;width:100%;margin-top:4px}
.st-seg button{flex:1;justify-content:center;height:30px;font-size:12px;padding:0 6px}
.sub-h{font-size:11.5px;font-weight:600;color:var(--muted);margin:18px 0 8px}
.mini-list{display:grid;gap:6px;font-size:12px}
.mini-list > div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 9px;border-radius:9px;background:var(--hover)}
.mini-list .copy-row{grid-template-columns:8px minmax(0,1fr) auto}
.mini-list i{width:8px;height:8px;border-radius:50%}
.link{color:var(--sky);font-weight:600;font-size:12px}
.lib-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.lib-card{display:flex;align-items:center;gap:16px;padding:18px 20px;text-align:left;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.lib-card:hover{transform:translateY(-2px);box-shadow:var(--shadow),0 14px 36px color-mix(in srgb,var(--c) 18%,transparent)}
.lib-card .fi{width:48px;height:48px;border-radius:14px}
.lib-card .fi svg{width:24px;height:24px}
.lib-card b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.lib-card span{display:block;font-size:12.5px;color:var(--muted)}
.lib-card .go{margin-left:auto;color:var(--faint)}
.lib-card .go svg{width:14px;height:14px}
.nav-item .count{font-size:11px;font-weight:600;color:var(--muted);background:var(--hover);padding:1px 7px;border-radius:10px}
@media (max-width:1180px){.cats{grid-template-columns:1fr 1fr}.lib-cards{grid-template-columns:1fr}}
@media (max-width:900px){.prow,.prow+*{grid-template-columns:34px minmax(0,1fr) 96px!important}.prow .vol-tag,.prow .dt,.prow .flags{display:none}.crow-m{grid-template-columns:22px minmax(0,1fr) 70px 30px}.crow-m .vol-tag,.crow-m .dt,.crow-m .pathc{display:none}}


/* ---------- Lente spaziale ---------- */
.lens{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;color:#fff;position:relative;

  box-shadow:0 20px 60px rgba(30,10,80,.25), inset 0 1px 0 rgba(255,255,255,.12)}
.lens::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 80% 20%,rgba(255,255,255,.4),transparent),radial-gradient(1.5px 1.5px at 65% 75%,rgba(255,255,255,.35),transparent),radial-gradient(1px 1px at 40% 85%,rgba(255,255,255,.3),transparent);opacity:.7}

.lens-nav{display:flex;gap:4px}
.lens-btn{width:30px;height:28px;border-radius:8px;display:grid;place-items:center;color:rgba(255,255,255,.85);background:rgba(255,255,255,.08)}

.lens-crumbs button{color:rgba(255,255,255,.6);padding:3px 7px;border-radius:7px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}

.lens-crumbs button.cur{color:#fff}
.lsep{color:rgba(255,255,255,.35)} .lsep svg{width:10px;height:10px}
.lens-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:0;position:relative;z-index:1}
.lens-panel{margin:14px 0 14px 14px;border-radius:18px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.lp-head{display:flex;align-items:center;gap:14px;padding:18px 18px 10px}

.lp-sel select option{color:#000}
.lens-panel .vl{padding:0 6px 8px}
.lrow{display:grid;grid-template-columns:24px 34px minmax(0,1fr) auto 14px;align-items:center;gap:10px;height:50px;margin:2px 4px;padding:0 10px;border-radius:12px;cursor:pointer;transition:background .15s}
.lrow:hover,.lrow.hot{background:rgba(255,255,255,.1)}

.lchk{width:20px;height:20px;border-radius:50%;border:1.6px solid rgba(255,255,255,.45);display:grid;place-items:center;transition:all .2s cubic-bezier(.2,.9,.3,1.4)}
.lchk:hover{border-color:#fff;transform:scale(1.1)}
.lchk.on{background:#fff;border-color:#fff;color:color-mix(in srgb,var(--c) 60%,#2a1468)}
.lchk svg{width:11px;height:11px}
.lico{width:34px;height:30px;display:grid;place-items:center}
.lico .glyph{width:34px;height:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.lico svg{width:20px;height:20px;color:var(--k)}
.lens-stage{position:relative;min-height:0;overflow:hidden}
.lens-glow{position:absolute;left:50%;top:50%;width:70%;height:70%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 35%,transparent),transparent 70%);filter:blur(30px);pointer-events:none}
.bub{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center;color:#fff;
  background:
    radial-gradient(circle at 32% 24%, rgba(255,255,255,.34), rgba(255,255,255,0) 42%),
    radial-gradient(circle at 50% 120%, color-mix(in srgb,var(--c) 55%,transparent), transparent 60%),
    linear-gradient(160deg, color-mix(in srgb,var(--c) 52%,#4b2bb0), color-mix(in srgb,var(--c) 30%,#2b1574));
  border:1.5px solid rgba(255,255,255,.32);

  animation:bubIn .7s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--d) * 35ms)}
.bub.file{background:radial-gradient(circle at 32% 24%, rgba(255,255,255,.3), rgba(255,255,255,0) 42%),linear-gradient(160deg, color-mix(in srgb,var(--k) 55%,#4b2bb0), color-mix(in srgb,var(--k) 25%,#2b1574))}
.bub:hover,.bub.hot{transform:scale(1.045);box-shadow:inset 0 0 40px rgba(255,255,255,.16),0 0 0 4px rgba(255,255,255,.12),0 24px 60px rgba(15,0,50,.45)}
.lens-stage.dimmed .bub:not(.hot){opacity:.55;filter:saturate(.7)}

.bub-in{display:flex;flex-direction:column;align-items:center;gap:2px;transform:scale(var(--s,1));max-width:78%;pointer-events:none}

.bub-in b{font-size:15px;font-weight:650;margin-top:6px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(10,0,40,.3)}
.bub-in span{font-size:13.5px;font-weight:600;opacity:.9}
.bub-dots{display:flex;gap:5px}
.bub-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55)}
.bub-chk{position:absolute;top:10%;right:10%;width:24px;height:24px;border-radius:50%;background:#fff;color:color-mix(in srgb,var(--c) 60%,#2a1468);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.bub-chk svg{width:13px;height:13px}
@keyframes bubIn{from{opacity:0;transform:scale(.4)}}
.lens-stage.zoom-in .bub{animation:zoomIn .6s cubic-bezier(.2,.9,.3,1.1) backwards;animation-delay:calc(var(--d) * 25ms)}
.lens-stage.zoom-out .bub{animation:zoomOut .55s cubic-bezier(.2,.9,.3,1.1) backwards;animation-delay:calc(var(--d) * 20ms)}
@keyframes zoomIn{from{opacity:0;transform:scale(.2)}}
@keyframes zoomOut{from{opacity:0;transform:scale(1.6)}}
.lens-foot{flex:none;display:flex;align-items:center;gap:24px;padding:12px 18px 16px;position:relative;z-index:2}
.lf-disk{width:min(400px,36%)}

.lf-bar i{display:block;height:100%;background:#fff;border-radius:3px;transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) backwards .2s}
.lf-sel{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13.5px}
.lf-i{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.14)} .lf-i svg{width:13px;height:13px}
.lsep2{width:1px;height:16px;background:rgba(255,255,255,.3)}
.lf-go{height:40px;padding:0 22px;border-radius:12px;font-weight:650;background:linear-gradient(140deg,color-mix(in srgb,var(--c) 55%,#c04bd8),color-mix(in srgb,var(--c) 35%,#7a3bd8));color:#fff;box-shadow:0 8px 24px rgba(120,40,200,.35);transition:transform .2s,box-shadow .2s,opacity .2s}
.lf-go:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(120,40,200,.45)}
.lf-go[disabled]{opacity:.4;cursor:default;box-shadow:none;transform:none}

/* ---------- Vista a icone ---------- */
.irow{display:grid;gap:0;padding:0 12px;justify-content:start}
.tile{width:150px;height:170px;padding:12px 8px 8px;border-radius:16px;text-align:center;display:flex;flex-direction:column;align-items:center;cursor:default;user-select:none}
.tile:hover{background:var(--hover)}
.tile.sel{background:color-mix(in srgb,var(--sky) 18%,transparent)}
.tile.sel b{background:var(--sky);color:#fff;border-radius:5px;padding:0 5px}
.tile-art{height:104px;display:grid;place-items:center}
.tile .folder{transform:scale(.82);margin:-6px 0}
.tile b{display:block;max-width:100%;font-weight:500;font-size:12.5px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile > span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.tile.folder-card{padding:12px 8px 8px}
.tile.folder-card:hover{transform:none;box-shadow:none}
.doc{position:relative;width:70px;height:88px;border-radius:8px 18px 8px 8px;background:linear-gradient(170deg,#fff,#F1F1F5);box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 20px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .35s cubic-bezier(.2,.9,.3,1.3)}
.doc-fold{position:absolute;top:0;right:0;width:18px;height:18px;border-radius:0 18px 0 6px;background:linear-gradient(225deg,transparent 50%,rgba(0,0,0,.08) 50%)}
.doc-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 18%,transparent);color:var(--k)}
.doc-ico svg{width:17px;height:17px}
.doc-ext{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--k);padding:1px 6px;border-radius:4px}
.ftile:hover .doc{transform:translateY(-3px) rotate(-2deg)}
[data-theme="dark"] .doc{background:linear-gradient(170deg,#3a3a40,#2c2c31)}
@media (max-width:1000px){.lens-body{grid-template-columns:1fr}.lens-stage{display:none}}

/* ---------- Animazioni ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes ringIn{from{stroke-dashoffset:var(--C)}}
@keyframes sunIn{from{opacity:0;transform:scale(.8) rotate(-16deg)}}
.enter .anim{animation:rise .65s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d,0) * 60ms)}
.enter .stagger > *{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.12s + var(--i,0) * 50ms)}
.enter .bar i,.enter .stackbar i,.enter .szbar .sb i{animation:grow 1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:.25s;transform-origin:left}
.enter .ring-arc{animation:ringIn 1.3s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:.15s}
.sun-anim path{animation:sunIn .9s cubic-bezier(.2,.8,.2,1) backwards}
.sun-anim path.d1{animation-delay:.1s}.sun-anim path.d2{animation-delay:.2s}
.fade-in{animation:rise .4s cubic-bezier(.2,.8,.2,1) backwards}

@media (max-width:1180px){
  .summary{grid-template-columns:1fr 1fr}
  .split{grid-template-columns:minmax(0,1fr)}

}

  .space{grid-template-columns:1fr;overflow:auto}
  .qrow,.qhead{grid-template-columns:minmax(0,1fr) 76px}

}
@media (max-width:820px){
  body{overflow:auto}
  #app{grid-template-columns:minmax(0,1fr);height:auto;min-height:100%}
  .sidebar{position:sticky;top:0;z-index:10;border-right:0;border-bottom:1px solid var(--line);min-width:0}
  .side-head{padding:12px 16px 8px}
  .side-scroll{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px}

  .topbar{display:none}
  main,#content{height:auto;min-height:calc(100vh - 110px)}
  .page{overflow:visible;height:auto}
  .page-inner{padding:8px 16px 40px}
  .fill{height:calc(100vh - 110px);padding:10px 10px 12px}
  .folder-grid{grid-template-columns:repeat(2,1fr)}
  .folder{transform:scale(.85)}
  .vhead{flex-wrap:wrap}
  .mini-input{display:none}
}

/* ==========================================================================
   Catalogo: indici e statistiche (con cache)
   ========================================================================== */
function indexCatalog(volId){
  const c = S.catalogs.get(volId);
  if (!c || c.flat) return c;
  const flat = [];
  const stack = [[c.root, []]];
  while (stack.length){
    const [node, path] = stack.pop();
    for (const ch of node[3]){
      const d = isDir(ch);
      flat.push({n:ch, p:path, l:ch[0].toLowerCase(), d, k: d ? 'dir' : kindOf(ch[0]), v:volId});
      if (d) stack.push([ch, path.concat(ch[0])]);
    }
  }
  c.flat = flat;
  return c;
}
function nodeAt(volId, path){
  const c = S.catalogs.get(volId); if (!c) return null;
  let n = c.root;
  for (const name of path){ const nx = (n[3]||[]).find(x => x[0] === name && isDir(x)); if (!nx) return null; n = nx; }
  return n;
}
let statCache = new WeakMap();
function nodeStats(node){
  let s = statCache.get(node); if (s) return s;
  s = {files:0, dirs:0, kinds:{}, exts:new Map(), top:[]};
  const all = []; const st = [[node, []]];
  while (st.length){
    const [n, p] = st.pop();
    for (const c of n[3]){
      if (isDir(c)){ s.dirs++; st.push([c, p.concat(c[0])]); continue; }
      s.files++;
      const k = kindOf(c[0]); s.kinds[k] = (s.kinds[k]||0) + c[1];
      const e = extOf(c[0]) || '—'; const ex = s.exts.get(e) || {ext:e, kind:k, count:0, size:0}; ex.count++; ex.size += c[1]; s.exts.set(e, ex);
      all.push({n:c, p});
    }
  }
  all.sort((a,b)=>b.n[1]-a.n[1]); s.top = all.slice(0, 1000);
  statCache.set(node, s);
  return s;
}
function topKinds(node){ return Object.entries(nodeStats(node).kinds).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]); }
function isOnline(v){
  if (!v || !v.online) return false;
  if (S.mode === 'demo' || S.mode === 'native') return true;
  return v.lastSeen && (Date.now() - v.lastSeen.getTime()) < 15*60*1000;
}
const volById = id => S.volumes.find(v => v.id === id);
function sortedKids(node, mode){
  const kids = node[3].slice();
  if (mode === 'size') kids.sort((a,b)=>b[1]-a[1]);
  else if (mode === 'date') kids.sort((a,b)=>b[2]-a[2]);
  else kids.sort((a,b)=> (isDir(b) - isDir(a)) || a[0].localeCompare(b[0], 'it', {numeric:true, sensitivity:'base'}));
  return kids;
}
function fullPath(v, path, name){ return ['/Volumes', v ? v.name : '?', ...path, ...(name ? [name] : [])].join('/'); }

function ringSVG(pct, color, size, stroke){
  const r = (size - stroke)/2, C = 2*Math.PI*r, p = Math.max(0, Math.min(1, pct));
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--hover)" stroke-width="${stroke}"/>
    <circle class="ring-arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" style="--C:${C};transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)"/></svg>`;
}
function usage(v){ const used = Math.max(0, (v.totalBytes||0) - (v.freeBytes||0)); return {used, pct: v.totalBytes ? used / v.totalBytes : 0}; }
function fileIcon(name, dir, colorKey, sm){
  const cls = 'fi' + (sm ? ' sm' : '');
  if (dir){ const c = colorOf(colorKey || 'sky'); return `<div class="${cls}" style="background:color-mix(in srgb,${c} 22%,transparent);color:${c}">${ICONS.folder}</div>`; }
  const k = kindOf(name); const c = colorOf(KINDS[k].color);
  return `<div class="${cls}" style="background:color-mix(in srgb,${c} 16%,transparent);color:${c}">${ICONS[k]}</div>`;
}
const statusPill = v => v.scanning != null ? `<span class="pill scan" data-scan="${esc(v.id)}"><span class="spin sm"></span>${scanLabel(v)}</span>` : isOnline(v) ? `<span class="pill on"><i></i>Collegato</span>` : `<span class="pill off"><i></i>Offline</span>`;
function scanLabel(v){ return v.scanning > 0 ? `Scansione · ${fmtInt(v.scanning)} file` : 'Scansione…'; }
function glassFolder(node, color){
  return `<div class="folder"><div class="f-back"></div><div class="f-paper p1"></div><div class="f-paper p2"></div><div class="f-paper p3"></div>
    <div class="f-front"><div class="f-dots">${topKinds(node).map(k=>`<i style="--k:${colorOf(KINDS[k].color)}" title="${KINDS[k].label}"></i>`).join('')}</div>
    <span class="f-size">${fmtBytes(node[1])}</span></div></div>`;
}
function folderCard(node, color, attrs, sub, i){
  return `<button class="folder-card sheen" style="--c:${color};--i:${i}" ${attrs}>${glassFolder(node, color)}
    <b>${esc(node[0])}</b><span class="fc-sub">${sub}</span></button>`;
}
const countAttr = (type, v) => `data-count="${type}" data-v="${v}"`;
function kindsBar(kinds){
  const entries = Object.entries(kinds).sort((a,b)=>b[1]-a[1]);
  const tot = entries.reduce((a,e)=>a+e[1],0) || 1;
  return `<div class="stackbar" style="height:8px">${entries.map(([k,b])=>`<i title="${KINDS[k].label} · ${fmtBytes(b)}" style="width:${b/tot*100}%;background:${colorOf(KINDS[k].color)}"></i>`).join('')}</div>
    <div class="legend">${entries.map(([k,b])=>`<span><i style="background:${colorOf(KINDS[k].color)}"></i>${KINDS[k].label} <b>${fmtBytes(b)}</b></span>`).join('')}</div>`;
}
function crumbs(parts){
  return parts.map((p,i) => (i ? `<span class="crumb-sep">${ICONS.chev}</span>` : '') +
    `<button class="crumb ${i===parts.length-1?'cur':''}" data-act="${p.act}" ${p.attrs||''}>${esc(p.label)}</button>`).join('');
}
function hl(name, toks){
  for (const t of toks){ if (!t || t.startsWith('.') || t.startsWith('*')) continue; const i = name.toLowerCase().indexOf(t); if (i < 0) continue;
    return esc(name.slice(0,i)) + '<mark>' + esc(name.slice(i, i+t.length)) + '</mark>' + esc(name.slice(i+t.length)); }
  return esc(name);
}

/* ---------- Lista virtualizzata ---------- */
function vlist(id, items, rowH, rowFn, opts = {}){
  LISTS[id] = {items, rowH, rowFn, ...opts};
  HOOKS.push(() => {
    const el = document.getElementById(id); if (!el) return;
    const inner = el.firstElementChild;
    inner.style.height = (items.length * rowH) + 'px';
    let last = -1;
    const draw = () => {
      const st = el.scrollTop, h = el.clientHeight || 600;
      const start = Math.max(0, Math.floor(st / rowH) - 10);
      const end = Math.min(items.length, Math.ceil((st + h) / rowH) + 10);
      if (start === last && !LISTS[id].dirty) return; last = start; LISTS[id].dirty = false;
      let html = '';
      for (let i = start; i < end; i++) html += rowFn(items[i], i);
      inner.innerHTML = `<div style="position:absolute;left:0;right:0;top:${start*rowH}px">${html}</div>`;
    };
    LISTS[id].draw = () => { LISTS[id].dirty = true; draw(); };
    LISTS[id].el = el;
    if (opts.key && S.scrollMem[opts.key] != null) el.scrollTop = S.scrollMem[opts.key];
    if (opts.scrollTo != null){
      const top = opts.scrollTo * rowH, h = el.clientHeight;
      if (top < el.scrollTop || top + rowH > el.scrollTop + h) el.scrollTop = Math.max(0, top - h/2);
    }
    el.addEventListener('scroll', () => { if (opts.key) S.scrollMem[opts.key] = el.scrollTop; requestAnimationFrame(draw); }, {passive:true});
    draw();
  });
  return `<div class="vl" id="${id}" tabindex="-1"><div class="vl-in"></div></div>`;
}

      <div class="t"><b>Libera spazio</b><span>${A.loaded ? 'fino a ' + fmtBytes(A.totals.all) : 'analizzo…'}</span></div>${S.bin.length ? `<span class="count">${S.bin.length}</span>` : ''}</button>
    <button class="nav-item ${S.view.type==='projects'?'active':''}" data-act="projects">
      <div class="ico" style="background:color-mix(in srgb,var(--peach) 18%,transparent);color:var(--peach)">${ICONS.proj}</div>

function favActive(){
  if (S.view.type !== 'volume') return -1;
  return S.favs.findIndex(f => f.v === S.view.id && f.p.join('/') === S.view.path.join('/') && f.p.length);
}
function placePill(){
  const pill = $('#navPill'), act = document.querySelector('#sideNav .nav-item.active');
  if (!act){ pill.style.opacity = 0; return; }
  pill.style.opacity = 1; pill.style.height = act.offsetHeight + 'px';
  pill.style.transform = `translateY(${act.offsetTop}px)`;
}
function isFav(volId, path){ return S.favs.some(f => f.v === volId && f.p.join('/') === path.join('/')); }
function toggleFav(volId, path){
  const i = S.favs.findIndex(f => f.v === volId && f.p.join('/') === path.join('/'));
  if (i >= 0){ S.favs.splice(i,1); toast('Rimosso dai preferiti'); } else { S.favs.push({v:volId, p:path.slice()}); toast('Aggiunto ai preferiti ★'); }
  store.set('hangar-favs', S.favs); render();
}

/* ==========================================================================
   LIBRERIA
   ========================================================================== */
function renderLibrary(){
  const vols = S.volumes;
  const total = vols.reduce((a,v)=>a+(v.totalBytes||0),0);
  const used = vols.reduce((a,v)=>a+usage(v).used,0);
  const files = vols.reduce((a,v)=>a+(v.fileCount||0),0);
  const online = vols.filter(isOnline).length;
  const [tu, tuU] = bytesParts(total), [uu, uuU] = bytesParts(used), [fu, fuU] = bytesParts(total-used);

  const bigFolders = []; let recent = [];
  for (const v of vols){
    const c = indexCatalog(v.id); if (!c) continue;
    for (const k of c.root[3]) if (isDir(k)) bigFolders.push({n:k, v});
    for (const f of c.flat) if (!f.d && (recent.length < 8 || f.n[2] > recent[recent.length-1].n[2])){ recent.push(f); recent.sort((a,b)=>b.n[2]-a.n[2]); if (recent.length > 8) recent.pop(); }
  }
  bigFolders.sort((a,b)=>b.n[1]-a.n[1]); bigFolders.splice(6);

  return `<div class="page"><div class="page-inner">
  <h1 class="page-title anim">I tuoi dischi</h1>
  <div class="page-sub anim" style="--d:1">${vols.length} ${vols.length===1?'disco':'dischi'} · ${online} ${online===1?'collegato':'collegati'} ora · ${fmtInt(files)} file indicizzati</div>

  <div class="summary anim" style="--d:2">
    <div class="card stat">
      <div class="k">Spazio usato su tutti i dischi</div>
      <div class="v num"><span ${countAttr('parts', used)}>${uu}<small>${uuU}</small></span> <small style="font-weight:500">di ${tu} ${tuU}</small></div>
      <div class="stackbar" style="margin-top:14px">${vols.map(v=>`<i title="${esc(v.name)} · ${fmtBytes(usage(v).used)}" style="width:${total?usage(v).used/total*100:0}%;background:${colorOf(v.color)}"></i>`).join('')}</div>
      <div class="legend">${vols.map(v=>`<span><i style="background:${colorOf(v.color)}"></i>${esc(v.name)}</span>`).join('')}</div>
    </div>
    <div class="card stat"><div class="k">Libero</div><div class="v num" ${countAttr('parts', total-used)}>${fu}<small>${fuU}</small></div><div class="k" style="margin-top:8px">${total?Math.round((total-used)/total*100):0}% della capacità totale</div></div>
    <div class="card stat"><div class="k">File indicizzati</div><div class="v num" ${countAttr('int', files)}>${fmtInt(files)}</div><div class="k" style="margin-top:8px">${fmtInt(vols.reduce((a,v)=>a+(v.folderCount||0),0))} cartelle</div></div>
    <div class="card stat"><div class="k">Ultima scansione</div><div class="v" style="font-size:20px;margin-top:8px">${fmtAgo(vols.map(v=>v.lastScan).filter(Boolean).sort((a,b)=>b-a)[0])}</div><div class="k" style="margin-top:6px">${esc(vols.find(v=>v.mac)?.mac || '')}</div></div>
  </div>

  ${(() => { const A = analyze(); const deliv = A.projects.filter(p => projStatus(p) !== 'attivo'); return `
  <div class="lib-cards anim" style="--d:3">
    <button class="card lib-card sheen" style="--c:${colorOf('sage')}" data-act="clean">
      <div class="fi" style="background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)">${ICONS.broom}</div>
      <div><span>Puoi liberare circa</span><b class="num">${fmtBytes(A.totals.all)}</b><span>${fmtBytes(A.totals.dups)} di duplicati · ${fmtBytes(A.totals.regen)} di proxy, render e cache</span></div>
      <span class="go">${ICONS.chev}</span></button>
    <button class="card lib-card sheen" style="--c:${colorOf('peach')}" data-act="projects">
      <div class="fi" style="background:color-mix(in srgb,var(--peach) 20%,transparent);color:var(--peach)">${ICONS.proj}</div>
      <div><span>Progetti sui dischi</span><b class="num">${A.projects.length}</b><span>${A.projects.filter(p => projStatus(p)==='attivo').length} in corso · ${deliv.length} consegnati o archiviati</span></div>
      <span class="go">${ICONS.chev}</span></button>
  </div>`; })()}

  <div class="section-title anim" style="--d:3">Dischi</div>
  <div class="vol-grid stagger">
    ${vols.map((v, i) => {
      const {used, pct} = usage(v); const c = colorOf(v.color);
      return `<button class="vol-card sheen ${isOnline(v)?'':'offline'}" style="--c:${c};--i:${i}" data-act="vol" data-vol="${esc(v.id)}">
        <div class="top">
          <div class="ring">${ringSVG(pct, c, 74, 8)}<div class="pct num">${Math.round(pct*100)}%</div></div>
          <div style="min-width:0"><h3>${esc(v.name)}</h3><div class="meta">${esc(v.format||'')} · ${fmtBytes(v.totalBytes)}</div>${statusPill(v)}</div>
        </div>
        <div class="bar"><i style="width:${pct*100}%"></i></div>
        <div class="nums"><span><b>${fmtBytes(used)}</b> usati</span><span><b>${fmtBytes(v.freeBytes)}</b> liberi</span></div>
      </button>`;
    }).join('') || `<div class="card empty" style="grid-column:1/-1">${S.mode === 'native' ? 'Collega un disco esterno: Hangar lo rileva e lo indicizza da solo.' : 'Nessun disco ancora. Apri Hangar sul Mac e collega un disco esterno.'}</div>`}
  </div>

  ${bigFolders.length ? `
  <div class="section-title anim" style="--d:4">Cartelle principali<span class="r muted">le più grandi su tutti i dischi</span></div>
  <div class="folder-grid stagger">${bigFolders.map((f,i) => folderCard(f.n, colorOf(f.v.color),
      `data-act="open" data-vol="${esc(f.v.id)}" data-path="${esc(JSON.stringify([f.n[0]]))}"`,
      `${esc(f.v.name)} · ${fmtInt(nodeStats(f.n).files)} file`, i)).join('')}</div>` : ''}

  ${recent.length ? `
  <div class="section-title anim" style="--d:5">Modificati di recente</div>
  <div class="card anim" style="--d:6;overflow:hidden">
    <table class="table"><thead><tr><th>File</th><th>Disco</th><th>Dimensione</th><th>Modificato</th></tr></thead>
      <tbody>${recent.map(f => { const v = volById(f.v); return `
        <tr data-act="reveal-in" data-vol="${esc(f.v)}" data-path="${esc(JSON.stringify(f.p))}" data-name="${esc(f.n[0])}">
          <td><div class="fname">${fileIcon(f.n[0])}<div class="nm"><b>${esc(f.n[0])}</b><span>${esc(f.p.join(' / ') || 'Cartella principale')}</span></div></div></td>
          <td><span class="vol-tag"><i style="background:${colorOf(v.color)}"></i>${esc(v.name)}</span></td>
          <td class="num">${fmtBytes(f.n[1])}</td><td class="muted">${fmtDate(f.n[2])}</td></tr>`; }).join('')}</tbody>
    </table>
  </div>` : ''}
  </div></div>`;
}

/* ==========================================================================
   DISCO: testata + Sfoglia / Spazio
   ========================================================================== */
function renderVolume(){
  const v = volById(S.view.id);
  if (!v) return `<div class="empty">Disco non trovato.</div>`;
  const {used, pct} = usage(v); const c = colorOf(v.color); const online = isOnline(v);
  const cat = indexCatalog(v.id);
  const mode = S.view.mode;
  const head = `
  <div class="card vhead sheen anim" style="--c:${c}">
    <div class="ring">${ringSVG(pct, c, 58, 7)}<div class="pct num">${Math.round(pct*100)}%</div></div>
    <div class="vt">
      <h1>${esc(v.name)} ${statusPill(v)}</h1>
      <div class="sub">${esc(v.format||'')} · ${fmtBytes(v.totalBytes)} · ${online ? 'collegato ora' : 'visto ' + fmtAgo(v.lastSeen)}${v.mac?' · '+esc(v.mac):''}</div>
    </div>
    ${S.mode === 'native' && online ? `<button class="btn btn-ghost vscan" data-act="scan" data-vol="${esc(v.id)}" ${v.scanning != null ? 'disabled' : ''} title="Aggiorna indice: rileggi il disco" aria-label="Aggiorna indice"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.2h-3.2"/></svg></button>` : ''}
    <div class="vstats">
      <div><div class="k">Usato</div><div class="v num" ${countAttr('bytes', used)}>${fmtBytes(used)}</div></div>
      <div><div class="k">Libero</div><div class="v num" ${countAttr('bytes', v.freeBytes)}>${fmtBytes(v.freeBytes)}</div></div>
      <div><div class="k">File</div><div class="v num" ${countAttr('int', v.fileCount)}>${fmtInt(v.fileCount)}</div></div>
      <div><div class="k">Indice</div><div class="v">${fmtAgo(v.lastScan)}</div></div>
    </div>
    <div class="seg" id="modeSeg">
      <span class="thumb"></span>
      <button class="${mode==='browse'?'on':''}" data-act="mode" data-mode="browse">${ICONS.browse}Sfoglia</button>
      <button class="${mode==='space'?'on':''}" data-act="mode" data-mode="space">${ICONS.pie}Spazio</button>
    </div>
  </div>`;
  HOOKS.push(placeSeg);
  const note = online ? '' : `<div class="offline-note anim" style="--d:1">${ICONS.plug}<span>Disco non collegato: stai navigando nell'indice salvato ${fmtAgo(v.lastScan)}. Per aprire i file nel Finder collegalo al Mac.</span></div>`;

  let body;
  if (!cat){
    const msg = S.loading.has(v.id) ? `<div class="spin"></div> Carico l'indice del disco…` : (v.scanning != null ? `<div class="spin"></div> Sto leggendo il disco… ${v.scanning ? fmtInt(v.scanning) + ' file finora' : ''}` : v.catalogPath ? 'Indice non disponibile.' : S.mode === 'native' ? 'Nessun indice ancora: premi il pulsante ↻ qui sopra.' : 'Nessuna scansione ancora: avviala dall\'app sul Mac.');
    body = `<div class="card loading" style="flex:1">${msg}</div>`;
  } else {
    if (!nodeAt(v.id, S.view.path)) S.view.path = [];
    body = mode === 'space' ? renderLens(v) : renderBrowse(v);
  }
  return `<div class="fill">${head}${note}${body}</div>`;
}
function placeSeg(){
  const seg = $('#modeSeg'); if (!seg) return;
  const on = seg.querySelector('button.on'), th = seg.querySelector('.thumb');
  th.style.width = on.offsetWidth + 'px'; th.style.transform = `translateX(${on.offsetLeft}px)`;
}

/* ---------- SFOGLIA ---------- */
function renderBrowse(v){
  const path = S.view.path;
  const layout = innerWidth < 820 ? 'list' : S.browse.layout;
  const sel = S.sel && S.sel.volId === v.id ? S.sel : null;
  const parts = [{label:v.name, act:'path', attrs:'data-n="0"'}, ...path.map((p,i)=>({label:p, act:'path', attrs:`data-n="${i+1}"`}))];
  const node = nodeAt(v.id, path);
  const fav = isFav(v.id, path);

  let main;
  if (layout === 'icons'){
    main = renderIcons(v, node);
  } else if (layout === 'columns'){
    // una colonna per ogni livello del percorso
    const cols = [];
    let n = nodeAt(v.id, []);
    for (let i = 0; i <= path.length; i++){
      const kids = sortedKids(n, S.browse.sort);
      const selName = i < path.length ? path[i] : (sel && sel.path.join('/') === path.join('/') ? sel.node[0] : null);
      const selIdx = selName != null ? kids.findIndex(k => k[0] === selName) : -1;
      const colPath = path.slice(0, i);
      const id = 'col' + i;
      cols.push(`<div class="col" style="animation-delay:${i === path.length ? 0 : 0}ms">${vlist(id, kids, 30, (k, j) => `
        <div class="row crow ${j===selIdx?'sel':''}" data-l="${id}" data-i="${j}">
          ${fileIcon(k[0], isDir(k), v.color, true)}
          <span class="ell">${esc(k[0])}</span>
          <span class="sz">${fmtBytes(k[1])}</span>
          <span class="chev">${isDir(k) ? ICONS.chev : ''}</span>
        </div>`, {key:`col:${v.id}:${colPath.join('/')}`, scrollTo: selIdx >= 0 ? selIdx : null, colPath})}</div>`);
      if (i < path.length) n = n[3].find(x => x[0] === path[i] && isDir(x));
    }
    main = `<div class="cols" id="cols">${cols.join('')}<div class="col-end"></div></div>`;
    HOOKS.push(() => { const el = $('#cols'); if (!el) return; const cs = el.querySelectorAll('.col'), w = cs[0].offsetWidth, vis = Math.max(1, Math.floor((el.clientWidth - 40) / w)); el.querySelector('.col-end').style.minWidth = Math.max(40, el.clientWidth - vis * w) + 'px'; el.style.scrollBehavior = 'auto'; el.scrollLeft = cs[Math.max(0, cs.length - vis)].offsetLeft - cs[0].offsetLeft; el.style.scrollBehavior = ''; });
  } else {
    const kids = sortedKids(node, S.browse.sort);
    const maxSize = Math.max(1, ...kids.slice(0, 500).map(k=>k[1]));
    const selIdx = sel && sel.path.join('/') === path.join('/') ? kids.findIndex(k => k[0] === sel.node[0]) : -1;
    const g = 'grid-template-columns:minmax(0,1fr) 190px 110px 100px';
    main = `<div class="thead" style="${g}">
        <button data-act="bsort" data-s="name">Nome ${S.browse.sort==='name'?'↓':''}</button>
        <button data-act="bsort" data-s="size">Dimensione ${S.browse.sort==='size'?'↓':''}</button>
        <span>Tipo</span>
        <button data-act="bsort" data-s="date">Modificato ${S.browse.sort==='date'?'↓':''}</button></div>
      ${vlist('blist', kids, 40, (k, j) => {
        const d = isDir(k); const col = d ? colorOf(v.color) : colorOf(KINDS[kindOf(k[0])].color);
        return `<div class="row ${j===selIdx?'sel':''}" style="${g};height:40px" data-l="blist" data-i="${j}">
          <div class="fname">${fileIcon(k[0], d, v.color, true)}<div class="nm"><b>${esc(k[0])}</b></div></div>
          <div class="szbar"><div class="sb"><i style="width:${Math.min(100,k[1]/maxSize*100)}%;background:${col}"></i></div><span>${fmtBytes(k[1])}</span></div>
          <span class="muted ell">${d ? fmtInt(k[3].length) + ' elementi' : KINDS[kindOf(k[0])].label}</span>
          <span class="muted">${fmtDate(k[2])}</span></div>`;
      }, {key:`list:${v.id}:${path.join('/')}`, scrollTo: selIdx >= 0 ? selIdx : null})}`;
  }

  const st = nodeStats(node);
  return `<div class="split anim" style="--d:2">
    <div class="card pane">
      <div class="pane-h">
        <div class="crumbs">${crumbs(parts)}</div>
        <button class="icon-btn ${fav?'on':''}" data-act="fav-here" title="${fav?'Rimuovi dai preferiti':'Aggiungi ai preferiti'}">${fav?ICONS.star:ICONS.starO}</button>
        <select class="sel-box" data-act="bsort-sel" title="Ordina per">
          <option value="name" ${S.browse.sort==='name'?'selected':''}>Nome</option>
          <option value="size" ${S.browse.sort==='size'?'selected':''}>Dimensione</option>
          <option value="date" ${S.browse.sort==='date'?'selected':''}>Data</option>
        </select>
        <div class="seg" style="padding:2px">
          <button class="${layout==='columns'?'on':''}" style="height:24px;padding:0 8px;${layout==='columns'?'background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12)':''}" data-act="layout" data-layout="columns" title="Colonne">${ICONS.cols}</button>
          <button class="${layout==='list'?'on':''}" style="height:24px;padding:0 8px;${layout==='list'?'background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12)':''}" data-act="layout" data-layout="list" title="Elenco">${ICONS.list}</button>
          <button class="${layout==='icons'?'on':''}" style="height:24px;padding:0 8px;${layout==='icons'?'background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12)':''}" data-act="layout" data-layout="icons" title="Icone">${ICONS.grid}</button>
        </div>
      </div>
      ${main}
      <div class="pane-foot"><span>${fmtInt(node[3].length)} elementi in questa cartella</span><span>${fmtInt(st.files)} file in totale · ${fmtBytes(node[1])}</span><span style="margin-left:auto" class="faint">↑↓ ← → per muoverti · Invio per aprire</span></div>
    </div>
    ${renderInspector(v, path, node)}
  </div>`;
}

/* ---------- INSPECTOR ---------- */
function renderInspector(vFallback, pathFallback, nodeFallback){
  let volId, path, node, isSel = false;
  if (S.sel && (S.view.type === 'search' || (S.sel.volId === vFallback?.id))){ ({volId, path, node} = S.sel); isSel = true; }
  else if (nodeFallback){ volId = vFallback.id; path = pathFallback.slice(0,-1); node = nodeFallback; }
  if (!node){
    return `<aside class="card insp" id="insp"><div class="insp-scroll"><div class="empty" style="padding-top:60px">
      <div class="fi" style="width:56px;height:56px;border-radius:16px;margin:0 auto 12px;background:var(--hover);color:var(--faint)">${ICONS.search}</div>
      Seleziona un file o una cartella per vederne i dettagli.</div></div></aside>`;
  }
  const v = volById(volId); const online = isOnline(v); const d = isDir(node);
  const isRoot = !isSel && !pathFallback.length;
  const myPath = d ? path.concat(isRoot ? [] : [node[0]]) : path;
  const share = v.totalBytes ? node[1] / v.totalBytes : 0;
  const k = kindOf(node[0]); const kc = colorOf(d ? v.color : KINDS[k].color);
  const st = d ? nodeStats(node) : null;
  const ext = extOf(node[0]);
  const fp = isRoot ? fullPath(v, []) : fullPath(v, path, node[0]);
  const fav = d && isFav(v.id, myPath);
  return `<aside class="card insp ${isSel?'open':''}" id="insp">
    <button class="icon-btn insp-close" data-act="insp-close">${ICONS.x}</button>
    <div class="insp-scroll fade-in">
      <div class="insp-hero">
        ${d ? `<div class="insp-folder" style="--c:${kc}">${glassFolder(node, kc)}</div>`
            : `<div class="insp-icon" style="background:color-mix(in srgb,${kc} 16%,transparent);color:${kc}">${ICONS[k]}</div>`}
        <h2>${esc(isRoot ? v.name : node[0])}</h2>
        <div class="kind">${d ? (isRoot ? 'Disco' : 'Cartella') : KINDS[k].label + (ext ? ' · .' + esc(ext) : '')}</div>
        <div class="bigsize num">${fmtBytes(node[1])}</div>
        <div class="share">${fmtPct(share)} del disco</div>
        <div class="bar" style="--c:${kc}"><i style="width:${Math.max(1, share*100)}%"></i></div>
      </div>
      ${d && st.files ? `<div style="margin-top:6px"><div class="muted" style="font-size:11.5px;margin-bottom:6px">Contenuto per tipo</div>${kindsBar(st.kinds)}</div>` : ''}
      <dl class="kv">
        <div><dt>Disco</dt><dd><span class="vol-tag"><i style="background:${colorOf(v.color)}"></i>${esc(v.name)}</span> ${online?'':'<span class="faint">· offline</span>'}</dd></div>
        ${d ? `<div><dt>Contenuto</dt><dd>${fmtInt(st.files)} file · ${fmtInt(st.dirs)} cartelle</dd></div>` : ''}
        <div><dt>Modificato</dt><dd>${node[2] ? dateTimeFmt.format(new Date(node[2]*1000)) : '—'}</dd></div>
        <div style="display:block"><dt>Percorso</dt><dd class="pathbox">${esc(fp)}</dd></div>

let sunPaths = [];
function sunburstSVG(node, basePath){
  const size = 360, cx = size/2, cy = size/2;
  const rings = [[66,108],[110,142],[144,170]];
  const total = node[1] || 1;
  const out = []; sunPaths = [];
  const arc = (r0, r1, a0, a1) => {
    if (a1 - a0 >= TAU - 1e-4) a1 = a0 + TAU - 1e-4;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (r, a) => [cx + r*Math.sin(a), cy - r*Math.cos(a)];
    const [x0,y0] = p(r1,a0), [x1,y1] = p(r1,a1), [x2,y2] = p(r0,a1), [x3,y3] = p(r0,a0);
    return `M${x0},${y0}A${r1},${r1} 0 ${large} 1 ${x1},${y1}L${x2},${y2}A${r0},${r0} 0 ${large} 0 ${x3},${y3}Z`;
  };
  const op = [1, .66, .4];
  function walk(n, depth, a0, path, ci, top){
    const kids = (n[3]||[]).slice().sort((a,b)=>b[1]-a[1]);
    let a = a0, idx = 0;
    for (const k of kids){
      const span = (k[1]/total)*TAU;
      if (span < 0.012){ a += span; continue; }
      const c = depth === 0 ? idx++ : ci;
      const t = depth === 0 ? k[0] : top;
      const myPath = isDir(k) ? path.concat(k[0]) : path;
      sunPaths.push({name:k[0], size:k[1], dir:isDir(k), path:myPath, top:t, node:k, parent:path});
      out.push(`<path class="d${depth}" d="${arc(rings[depth][0], rings[depth][1], a, a+span)}" fill="${colorOf(PALETTE[c % PALETTE.length])}" fill-opacity="${op[depth]}" data-si="${sunPaths.length-1}" data-top="${esc(t)}"/>`);
      if (isDir(k) && depth < 2) walk(k, depth+1, a, myPath, c, t);
      a += span;
    }
  }
  walk(node, 0, 0, basePath, 0, null);
  return `<svg viewBox="0 0 ${size} ${size}" id="sunSvg" class="${S.anim || S.sunAnim ? 'sun-anim' : ''}">${out.join('')}</svg>`;
}

function runSearch(){
  const q = S.q; const text = q.text.trim().toLowerCase();
  const toks = text.split(/\s+/).filter(Boolean);
  const exts = toks.filter(t => /^\*?\.\w+$/.test(t)).map(t => t.replace(/^\*?\./,''));

  for (const v of S.volumes){
    if (q.vol !== 'all' && q.vol !== v.id) continue;
    const c = indexCatalog(v.id); if (!c) continue;
    for (const f of c.flat){
      if (q.kind === 'cartelle' ? !f.d : (q.kind !== 'tutti' && f.k !== q.kind)) continue;
      if (q.size && f.n[1] < q.size) continue;
      if (q.date && f.n[2] < now - q.date*86400) continue;
      if (exts.length && (f.d || !exts.includes(extOf(f.n[0])))) continue;

  }
