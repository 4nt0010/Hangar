name: Compila Hangar per Mac

on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Versione e indirizzi
        run: |
          echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV
          echo "BUILD=${{ github.run_number }}" >> $GITHUB_ENV
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "UIURL=https://${OWNER}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_ENV

      - name: Compila (Apple Silicon + Intel)
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p build
          for ARCH in arm64 x86_64; do
            xcrun swiftc -O -sdk "$SDK" -target ${ARCH}-apple-macos12.0 \
              -module-name Hangar mac/Sources/*.swift -o build/Hangar-${ARCH}
          done
          lipo -create -output build/Hangar build/Hangar-arm64 build/Hangar-x86_64
          lipo -info build/Hangar

      - name: Icona
        run: |
          xcrun swift mac/make-icon.swift build/AppIcon.iconset
          iconutil -c icns build/AppIcon.iconset -o build/AppIcon.icns

      - name: Pacchetto Hangar.app
        run: |
          APP=build/Hangar.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          cp build/Hangar $APP/Contents/MacOS/Hangar
          cp build/AppIcon.icns $APP/Contents/Resources/AppIcon.icns
          cp docs/index.html $APP/Contents/Resources/index.html
          sed -e "s|__VERSION__|$VERSION|" -e "s|__BUILD__|$BUILD|" \
              -e "s|__REPO__|$GITHUB_REPOSITORY|" -e "s|__UIURL__|$UIURL|" \
              mac/Info.plist > $APP/Contents/Info.plist
          plutil -lint $APP/Contents/Info.plist
          codesign --force --deep --sign - $APP
          codesign --verify --verbose $APP

      - name: DMG e zip
        run: |
          cd build
          ditto -c -k --keepParent Hangar.app Hangar.zip
          mkdir dmg && cp -R Hangar.app dmg/ && ln -s /Applications dmg/Applicazioni
          hdiutil create -volname "Hangar" -srcfolder dmg -ov -format UDZO Hangar.dmg

      - name: Pubblica la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Hangar ${{ env.VERSION }}
          body: ${{ github.event.head_commit.message || 'Nuova versione' }}
          files: |
            build/Hangar.dmg
            build/Hangar.zip
